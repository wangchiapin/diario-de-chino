<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>老師後台 · Diario de chino</title>
<style>
:root{--bg:#ece8df;--card:#f8f6f0;--line:#d9d3c5;--text:#3b372f;--sub:#7b7467;--accent:#7a6a50;--accent-soft:#e6dfd0;--ok:#5f7f63;--warn:#a04b3f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:18px;cursor:pointer}
button.quiet{background:transparent;color:var(--accent)}
button:disabled{opacity:.5}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--warn)} .ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:600}
td.em{min-width:210px}
.small{font-size:12px}
a.pv{font-size:13px;color:var(--accent);margin-left:6px}
.hwrow{border-top:1px solid var(--line);padding:10px 0}
.hwrow:first-of-type{border-top:0}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent-soft);margin:2px 4px 2px 0}
.chip.todo{background:#e8e4db;color:#7b7467}.chip.submitted{background:#f0e2c3;color:#5a4624}.chip.graded{background:#dbe7da;color:#35553a}
.picks label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:14px}
.picks input{width:auto}
button.tiny{font-size:12px;padding:3px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hidden{display:none !important}
ol{margin:6px 0 0 18px;padding:0}

/* 批改 */
.gbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.gbar .sc{font-size:18px;font-weight:600;margin-left:auto}
.gnote{background:#f0ece1;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.gi{padding:12px 0;border-top:1px solid var(--line)}
.gi:first-of-type{border-top:0}
.gi.need{background:#f7ebe6;border-radius:8px;padding:12px 8px}
.gq{font-size:17px;line-height:1.9}
.gq .no{color:var(--sub);font-size:13px;margin-right:6px}
.gq .es{font-size:13px;color:var(--sub);display:block}
.ga{margin-top:4px;font-size:16px}
.ga .lab,.gk .lab{font-size:12px;color:var(--sub);margin-right:6px}
.gk{margin-top:2px;font-size:15px;color:#5f7f63}
.gk .nt{display:block;font-size:12px;color:var(--sub)}
.gb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gb button{background:#fff;color:var(--text);border:1px solid var(--line);padding:6px 16px;min-width:64px}
.gb button.on.y{background:#dbe7da;border-color:#8fb293;color:#35553a;font-weight:600}
.gb button.on.h{background:#f0e2c3;border-color:#d2b97f;color:#5a4624;font-weight:600}
.gb button.on.n{background:#f0d9d3;border-color:#d39b8f;color:#8a3a2e;font-weight:600}
.gtools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.gtools button{background:#fff;color:var(--text);border:1px solid var(--line);padding:4px 11px;font-size:14px;border-radius:8px;min-width:36px}
.gtools .sep{font-size:12px;color:var(--sub);margin-left:4px}
.gedit{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:17px;line-height:1.8;min-height:50px;white-space:pre-wrap;outline:none}
.gedit:focus{border-color:var(--accent)}
.gblank{display:inline-block;padding:1px 9px;margin:2px 4px 2px 0;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff}
.gblank.y{background:#dbe7da;border-color:#8fb293}.gblank.n{background:#f0d9d3;border-color:#d39b8f}
.gnotebox{width:100%;min-height:70px;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.gmsg{font-size:13px;margin-top:6px}
@media (max-width:640px){
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px;background:#fff}
  td{border:0;padding:3px 2px}
  td.em{min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>老師後台</h1><button class="quiet hidden" id="btnLogout">登出</button></header>
  <div id="app"><div class="card muted">載入中…</div></div>
</div>
<script src="portal-hw.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, updateDoc, deleteField, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDB6zYAHvi0oTkObv-qDnP6nn0UUnscby0",
  authDomain: "moneybook-50481.firebaseapp.com",
  projectId: "moneybook-50481",
  storageBucket: "moneybook-50481.firebasestorage.app",
  messagingSenderId: "549256761796",
  appId: "1:549256761796:web:254332f109e7b8ad871491"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let uid = null, students = {}, roster = {}, studentsLoaded = false, rosterLoaded = false, loadErr = '';
let unsubs = [];
let pool = {}, poolLoaded = false, admins = {}, hw = {}, hwUnsubs = {};   // hw：學生代號 → { 作業代號 → 文件 }
let assignOpen = null, assignSel = {}, hwNote = {}, adminDraft = { code: '', label: '' }, adminMsg = null;
const poolCache = {};
let gradeOpen = null, gdraft = null, gmsg = null;   // 批改中：{sid,wid}、批改草稿
let rowMsg = {};          // 學生代號 → {text, ok}
let drafts = {};          // 學生代號 → 還沒儲存的電子郵件
let authReady = false, loginErr = '';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function payText(s){
  if(s.pay === 'package') return s.remaining != null ? `包堂・剩 ${s.remaining} 堂` : '包堂';
  if(s.pay === 'single') return '單堂付費';
  return '—';
}
function fmtTime(ms){
  if(!ms) return '—';
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function studentUrl(){ return location.href.replace(/admin\.html.*$/, '') + '?t=' + uid; }

function poolState(id){
  const p = pool[id]; if(!p) return null;
  const key = id + ':' + (p.upd || p.ts || 0);
  if(!poolCache[key]){ try{ poolCache[key] = JSON.parse(p.data); }catch(e){ poolCache[key] = {}; } }
  return poolCache[key];
}
function hwChip(d){
  if(!d) return '';
  if(d.status === 'graded') return `<span class="chip graded">已批改${d.result ? ' ' + esc(d.result.got) + '/' + esc(d.result.max) : ''}</span>`;
  if(d.status === 'submitted') return '<span class="chip submitted">已交，待批改</span>';
  return '<span class="chip todo">未交</span>';
}
function pendingHtml(active){
  const list = [];
  active.forEach(sid => Object.keys(hw[sid] || {}).forEach(wid => { const d = hw[sid][wid]; if(d.status === 'submitted') list.push({ sid, wid, d }); }));
  if(!list.length) return '';
  list.sort((a, b) => (a.d.submittedAt || 0) - (b.d.submittedAt || 0));
  return `<div class="card"><h2>等你批改（${list.length}）</h2>${list.map(x => `<div class="row" style="padding:5px 0"><b>${esc(students[x.sid].name)}</b><span class="muted">${esc(x.d.title || '')}</span><span class="muted small">${esc(fmtTime(x.d.submittedAt))} 交</span><button class="tiny" data-g="${esc(x.sid)}" data-gw="${esc(x.wid)}">批改</button></div>`).join('')}</div>`;
}
function hwHtml(active){
  let h = pendingHtml(active) + `<div class="card"><h2>作業（從練習單產生器發布）</h2>`;
  const ids = Object.keys(pool).sort((a, b) => (pool[b].upd || pool[b].ts || 0) - (pool[a].upd || pool[a].ts || 0));
  if(!poolLoaded){ h += '<div class="muted">載入中…</div>'; }
  else if(!ids.length){ h += `<div class="muted small">還沒有作業。到練習單產生器，登入 Google 後按「發布給學生頁」，作業就會出現在這裡。第一次要先在下面「發布帳號」設定。</div>`; }
  ids.forEach(wid => {
    const p = pool[wid], st = poolState(wid) || {}, total = window.hwTotal ? hwTotal(st) : (p.count || 0);
    const rows = active.map(sid => ({ sid, d: (hw[sid] || {})[wid] })).filter(x => x.d);
    h += `<div class="hwrow" data-wid="${esc(wid)}"><div class="row"><b>${esc(p.name || '（沒有名稱）')}</b><span class="muted small">${total} 分　${esc(fmtTime(p.upd || p.ts))}</span>
      <button class="tiny quiet" data-a="assign">${assignOpen === wid ? '收起' : '發給學生'}</button></div>`;
    if(rows.length) h += `<div class="small" style="margin-top:4px">${rows.map(x => `<span class="muted">${esc(students[x.sid].name)}</span> ${hwChip(x.d)}${x.d.status !== 'todo' ? `<button class="tiny quiet" data-g="${esc(x.sid)}" data-gw="${esc(wid)}">${x.d.status === 'graded' ? '看批改' : '批改'}</button> ` : ''}`).join('')}</div>`;
    if(assignOpen === wid){
      const sel = assignSel[wid] || {};
      h += `<div class="picks" style="margin-top:8px">${active.map(sid => {
        const done = (hw[sid] || {})[wid], noMail = !roster[sid];
        return `<label><input type="checkbox" data-sid="${esc(sid)}" ${done ? 'disabled' : ''} ${sel[sid] && !done ? 'checked' : ''}>${esc(students[sid].name)}${done ? '（已發過）' : ''}${noMail && !done ? '（還沒填電子郵件）' : ''}</label>`;
      }).join('')}</div>
      <div class="row" style="margin-top:6px"><button class="tiny quiet" data-a="all">全選</button><button class="tiny" data-a="send">發出</button><span class="small ${hwNote[wid] && !hwNote[wid].ok ? 'err' : 'ok'}">${esc(hwNote[wid] ? hwNote[wid].text : '')}</span></div>`;
    }
    h += '</div>';
  });
  h += `</div>`;

  h += `<div class="card"><h2>發布帳號（讓練習單產生器可以發布作業）</h2>
    <div class="muted small">老師代號（貼到練習單產生器）：</div>
    <div class="row" style="margin:4px 0 10px"><input id="tidShow" readonly value="${esc(uid)}" style="flex:1;min-width:200px"><button id="tidCopy" class="tiny">複製</button></div>
    <div class="muted small">練習單產生器登入 Google 後，會顯示「帳號代碼」。把它貼在這裡，這個帳號才能發布作業：</div>
    <div class="row" style="margin:4px 0"><input id="adCode" placeholder="產生器顯示的帳號代碼" value="${esc(adminDraft.code)}" style="flex:1;min-width:200px"><input id="adLabel" placeholder="備註（例如：我的 Google）" value="${esc(adminDraft.label)}" style="flex:1;min-width:140px"><button id="adAdd">允許</button></div>
    <div class="small ${adminMsg && !adminMsg.ok ? 'err' : 'ok'}">${esc(adminMsg ? adminMsg.text : '')}</div>
    ${Object.keys(admins).map(k => `<div class="row small" style="margin-top:4px"><span>${esc(admins[k].label || '（沒有備註）')}</span><span class="muted">${esc(k.slice(0, 6))}…${esc(k.slice(-4))}</span><button class="tiny quiet" data-ad="${esc(k)}">移除</button></div>`).join('')}
  </div>`;
  return h;
}
function bindHw(root, active){
  root.querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGrade(b.dataset.g, b.dataset.gw));
  const c = $('tidCopy'); if(c) c.onclick = async () => { try{ await navigator.clipboard.writeText(uid); c.textContent = '已複製'; }catch(e){ $('tidShow').select(); } };
  const ac = $('adCode'), al = $('adLabel');
  if(ac){ ac.oninput = () => { adminDraft.code = ac.value; }; al.oninput = () => { adminDraft.label = al.value; }; $('adAdd').onclick = addAdmin; }
  root.querySelectorAll('[data-ad]').forEach(b => b.onclick = async () => {
    try{ await deleteDoc(doc(db, 'portal', uid, 'admins', b.dataset.ad)); adminMsg = { text: '已移除', ok: true }; }catch(err){ console.error(err); adminMsg = { text: '移除失敗，請再試一次', ok: false }; }
    render();
  });
  root.querySelectorAll('.hwrow').forEach(row => {
    const wid = row.dataset.wid;
    row.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if(a === 'assign'){ assignOpen = assignOpen === wid ? null : wid; hwNote[wid] = null; return render(); }
      if(a === 'all'){ assignSel[wid] = {}; active.forEach(sid => { if(!(hw[sid] || {})[wid]) assignSel[wid][sid] = true; }); return render(); }
      if(a === 'send') return sendAssign(wid);
    });
    row.querySelectorAll('input[data-sid]').forEach(i => i.onchange = () => { (assignSel[wid] = assignSel[wid] || {})[i.dataset.sid] = i.checked; });
  });
}
async function addAdmin(){
  const code = adminDraft.code.trim(), label = adminDraft.label.trim();
  if(!/^[A-Za-z0-9]{20,40}$/.test(code)){ adminMsg = { text: '帳號代碼格式不對（要是練習單產生器顯示的那一長串英數字）', ok: false }; return render(); }
  if(code === uid){ adminMsg = { text: '這是你自己的老師帳號，不用另外允許', ok: false }; return render(); }
  try{
    await setDoc(doc(db, 'portal', uid, 'admins', code), { label, createdAt: Date.now() });
    adminDraft = { code: '', label: '' }; adminMsg = { text: '✓ 已允許，現在可以在練習單產生器發布作業了', ok: true };
  }catch(err){ console.error(err); adminMsg = { text: err && err.code === 'permission-denied' ? '沒有權限：Firestore 規則還沒加作業那幾段' : '儲存失敗，請再試一次', ok: false }; }
  render();
}
async function sendAssign(wid){
  const st = poolState(wid), sel = assignSel[wid] || {};
  const pick = Object.keys(sel).filter(sid => sel[sid] && students[sid] && !students[sid].archived && !(hw[sid] || {})[wid]);
  if(!pick.length){ hwNote[wid] = { text: '請先勾選要發給哪些學生', ok: false }; return render(); }
  if(!st || !st.sections){ hwNote[wid] = { text: '這份作業的內容讀不出來，請回產生器重新發布', ok: false }; return render(); }
  let okN = 0, failN = 0;
  for(const sid of pick){
    try{ await setDoc(doc(db, 'portal', uid, 'students', sid, 'hw', wid), hwAssignDoc(wid, st, Date.now())); okN++; }
    catch(err){ console.error(err); failN++; }
  }
  assignSel[wid] = {};
  hwNote[wid] = failN ? { text: `發出 ${okN} 位，${failN} 位失敗（可能是規則還沒加）`, ok: false } : { text: `✓ 已發給 ${okN} 位學生`, ok: true };
  render();
}

/* ───────── 批改畫面 ───────── */
const NUMZH = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const MANUAL = { translate: 1, zh2es: 1, sentence: 1 };
function nl2br(t){ return esc(t).replace(/\n/g, '<br>'); }

// 把這份作業整理成一題一題：題目、學生答案、標準答案、分數
function gradeItems(sid, wid){
  const st = poolState(wid), d = (hw[sid] || {})[wid]; if(!st || !st.sections || !d) return null;
  const ans = d.answers || {}, auto = hwAutoGrade(st, ans), old = d.review && d.review.items || {};
  const list = [];
  hwActiveSections(st).forEach((sec, si) => {
    const items = hwActiveItems(sec), perm = sec.type === 'match' ? hwMatchPerm(items) : null;
    items.forEach((it, qi) => {
      const a = ans[it.id], au = auto.items[it.id], o = old[it.id], t = sec.type;
      let q = '', es = '', mine = '';
      if(t === 'fill'){ q = esc(it.zh || '').replace('__', '＿＿＿'); es = it.es || ''; mine = a || ''; }
      else if(t === 'cloze'){ q = esc(it.text || '').replace(/\{(\d+)\}/g, '（$1）'); mine = Array.isArray(a) ? a.map(x => x || '＿').join('、') : ''; }
      else if(t === 'order'){ q = esc((it.tokens || []).join(' ／ ')); es = it.es || ''; mine = Array.isArray(a) ? a.join('') : ''; }
      else if(t === 'choice'){ q = esc(it.es || ''); es = (it.options || []).map((x, i) => hwLetter(i) + ' ' + x).join('　'); mine = typeof a === 'number' ? hwLetter(a) + '　' + ((it.options || [])[a] || '') : ''; }
      else if(t === 'fix'){ q = esc(it.wrong || ''); mine = a || ''; }
      else if(t === 'translate'){ q = esc(it.es || ''); mine = a || ''; }
      else if(t === 'zh2es'){ q = esc(it.zh || ''); mine = a || ''; }
      else if(t === 'sentence'){ q = esc(it.cue || ''); es = it.es || ''; mine = a || ''; }
      else if(t === 'match'){ q = esc(it.zh || ''); const r = typeof a === 'number' && perm[a] != null ? items[perm[a]] : null; mine = r ? hwLetter(a) + '　' + r.es : ''; }
      const row = { id: it.id, type: t, no: qi + 1, secNo: si, first: qi === 0, q, es, mine, key: hwKeyText(t, it), note: String(it.note || it.tip || ''), max: au.max, manual: !au.auto,
        got: au.auto ? au.got : null, blanks: au.blanks ? au.blanks.slice() : null, mark: MANUAL[t] ? nl2br(mine) : '' };
      if(o){ if(o.got != null) row.got = o.got; if(o.blanks) row.blanks = o.blanks.slice(); if(typeof o.mark === 'string' && o.mark) row.mark = o.mark; }
      list.push(row);
    });
  });
  return { list, secs: hwActiveSections(st).map(sc => sc.type), note: d.review && d.review.note || '', hideScore: !!(d.review && d.review.hideScore) };
}
const GDKEY = (sid, wid) => 'dc.grade.' + uid + '.' + sid + '.' + wid;
function gradeSaveLocal(){ if(!gradeOpen || !gdraft) return;
  if(gdraft.word){ try{ localStorage.setItem(GDKEY(gradeOpen.sid, gradeOpen.wid), JSON.stringify({ word: 1, t: Date.now(), mark: gdraft.list[0].mark, got: gdraft.wordGot, note: gdraft.note, hide: !!gdraft.hideScore })); }catch(e){} return; }
  try{ localStorage.setItem(GDKEY(gradeOpen.sid, gradeOpen.wid), JSON.stringify({ t: Date.now(), items: gdraft.list.map(r => ({ id: r.id, got: r.got, blanks: r.blanks, mark: r.mark })), note: gdraft.note, hide: !!gdraft.hideScore })); }catch(e){} }
function gradeLoadLocal(sid, wid, g){
  try{
    const d = (hw[sid] || {})[wid], raw = localStorage.getItem(GDKEY(sid, wid)); if(!raw || !d || d.status !== 'submitted') return false;
    const sv = JSON.parse(raw), by = {}; sv.items.forEach(x => by[x.id] = x);
    g.list.forEach(r => { const x = by[r.id]; if(!x) return; if(x.got != null) r.got = x.got; if(x.blanks) r.blanks = x.blanks; if(typeof x.mark === 'string') r.mark = x.mark; });
    g.note = sv.note || ''; g.hideScore = !!sv.hide; return true;
  }catch(e){ return false; }
}
function gradeClearLocal(sid, wid){ try{ localStorage.removeItem(GDKEY(sid, wid)); }catch(e){} }

function loadJs(src){
  return new Promise((res, rej) => {
    if(window.__loaded && window.__loaded[src]) return res();
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => { (window.__loaded = window.__loaded || {})[src] = 1; res(); }; sc.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(sc);
  });
}
async function openGrade(sid, wid){
  const d0 = (hw[sid] || {})[wid], st = poolState(wid);
  if(!st || !st.sections || !d0){ alert('這份作業的內容讀不出來，請回練習單產生器重新發布。'); return; }
  // 學生有上傳 Word 嗎？有的話用「看 Word、標記、給總分」的方式批改
  let fileDoc = null;

async function openWordGrade(sid, wid, fileDoc, st){
  const d = hw[sid][wid], total = hwTotal(st);
  let html = '', warn = '';
  try{
    await loadJs('vendor/mammoth.browser.min.js');

    html = hwCleanMark((await window.mammoth.convertToHtml({ arrayBuffer: buf })).value);
  }catch(err){ console.error(err); warn = '這份 Word 的內容讀不出來（可能格式比較特別）。請先按「下載原檔」自己看，再把想說的寫在下面。'; }
  const old = d.review && d.review.word;
  const row = { id: '__word', type: 'word', manual: true, max: total, got: null, mark: (old && old.mark) || html || '' };
  gdraft = { word: true, list: [row], fileDoc, total, warn, fileName: fileDoc.name, keys: hwKeyLines(st).map(k => (NUMZH[k.sec] || k.sec + 1) + '・' + k.no + '　' + k.key),
    note: d.review && d.review.note || '', hideScore: !!(d.review && d.review.hideScore), wordGot: d.result ? d.result.got : null };
  gradeOpen = { sid, wid, restored: false };
  const restored = gradeLoadLocalWord(sid, wid, gdraft); gradeOpen.restored = restored;

}
function gradeLoadLocalWord(sid, wid, g){

    g.list[0].mark = sv.mark || g.list[0].mark; g.wordGot = sv.got; g.note = sv.note || ''; g.hideScore = !!sv.hide; return true;

}

function gradeRender(){
  const o = gradeOpen, root = $('app'), d = (hw[o.sid] || {})[o.wid], s = students[o.sid] || {}, g = gdraft;
  if(!d){ gradeOpen = null; return render(); }
  if(g.word) return gradeWordRender();
  g.clozeMine = {};
  g.list.forEach(r => { if(r.type === 'cloze'){ const a = (d.answers || {})[r.id]; g.clozeMine[r.id] = Array.isArray(a) ? a : []; } });
  const manualN = g.list.filter(r => r.manual).length, tot = gradeTotal();
  let h = `<div class="gbar"><button class="quiet" id="gBack">‹ 返回</button><div><b>${esc(s.name || '')}</b> <span class="muted">${esc(d.title || '')}</span></div><div class="sc" id="gScore">${tot.got} / ${tot.max}</div></div>`;
  if(d.status === 'graded') h += `<div class="gnote">這份已經批改過了（${esc(d.result ? d.result.got + '/' + d.result.max : '')}）。改完按「更新批改」，學生會看到新的結果。</div>`;

    if(r.secNo !== lastSec){ if(open) h += '</div>'; lastSec = r.secNo; open = true; h += `<div class="card"><h2>${NUMZH[r.secNo] || r.secNo + 1}、${esc(HW_TYPE_NAME[r.type] || r.type)}</h2>`; }
    h += gcardHtml(r);

  if(open) h += '</div>';
  h += gradeBottomHtml(d, g);
  root.innerHTML = h;
  bindGrade(root);

const HW_TYPE_NAME = { fill: '選詞填空', cloze: '段落填空', order: '排序', choice: '選擇', fix: '改錯', translate: '西翻中', zh2es: '中翻西', match: '配對', sentence: '造句' };

function gradeUpdateScore(){ if(gdraft.word) return gradeSaveLocal(); const t = gradeTotal(); const el = $('gScore'); if(el) el.textContent = t.got + ' / ' + t.max; gradeSaveLocal(); }
function gradeCard(root, id){ return root.querySelector(`.gi[data-id="${CSS.escape(id)}"]`); }
function gradeRedrawCard(root, id){
  const r = gdraft.list.find(x => x.id === id), el = gradeCard(root, id); if(!r || !el) return;
  const t = document.createElement('div'); t.innerHTML = gcardHtml(r); el.replaceWith(t.firstChild);
}
function bindGrade(root){
  $('gBack').onclick = closeGrade;
  $('gNote').oninput = e => { gdraft.note = e.target.value; gradeSaveLocal(); };
  $('gHide').onchange = e => { gdraft.hideScore = e.target.checked; gradeSaveLocal(); };
  $('gDone').onclick = gradeFinish;
  const rd = $('gRedo'); if(rd) rd.onclick = gradeRedo;
  // 工具列：按下去時不要讓選取的文字消失
  root.onmousedown = e => { if(e.target.closest('.gtools button')) e.preventDefault(); };
  root.onclick = e => {
    const card = e.target.closest('.gi'); if(!card) return;
    const id = card.dataset.id, r = gdraft.list.find(x => x.id === id); if(!r) return;
    const fb = e.target.closest('.gtools button');
    if(fb){
      const edit = card.querySelector('[data-edit]'); edit.focus();
      document.execCommand('styleWithCSS', false, true);
      if(fb.dataset.f === 'hl'){ if(!document.execCommand('hiliteColor', false, fb.dataset.c)) document.execCommand('backColor', false, fb.dataset.c); }
      else document.execCommand(fb.dataset.f, false, null);
      r.mark = edit.innerHTML; gradeSaveLocal(); return;
    }
    const bl = e.target.closest('[data-bl]');
    if(bl){ const k = +bl.dataset.bl; r.blanks[k] = !r.blanks[k]; r.got = r.blanks.filter(Boolean).length; gradeRedrawCard(root, id); gradeUpdateScore(); return; }
    const gb = e.target.closest('.gb button');
    if(gb){
      r.got = +gb.dataset.v;
      const edit = card.querySelector('[data-edit]'); if(edit) r.mark = edit.innerHTML;
      gradeRedrawCard(root, id); gradeUpdateScore();
    }
  };
  root.oninput = e => {
    const ed = e.target.closest && e.target.closest('[data-edit]'); if(!ed) return;
    const r = gdraft.list.find(x => x.id === ed.closest('.gi').dataset.id); if(r){ r.mark = ed.innerHTML; gradeSaveLocal(); }
  };
  // 貼上時只貼純文字，免得帶進奇怪的格式
  root.onpaste = e => { const ed = e.target.closest && e.target.closest('[data-edit]'); if(!ed) return; e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text')); };
}
function setGmsg(text, ok){ gmsg = { text, ok }; const el = $('gMsg'); if(el){ el.textContent = text; el.className = 'gmsg ' + (ok ? 'ok' : 'err'); } }
async function gradeFinishWord(){

    gradeClearLocal(o.sid, o.wid);
    gradeOpen = null; gdraft = null; gmsg = null; render(); window.scrollTo(0, 0);

async function gradeFinish(){
  if(gdraft.word) return gradeFinishWord();
  const o = gradeOpen, g = gdraft, d = (hw[o.sid] || {})[o.wid];
  const need = g.list.filter(r => r.got == null);
  if(need.length){
    g.showNeed = true; gradeRender();
    setGmsg(`還有 ${need.length} 題沒打分（已標成紅底），打完才能送出`, false);
    const el = document.querySelector('.gi.need'); if(el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  const items = {};
  g.list.forEach(r => {
    const it = { got: r.got, max: r.max, key: r.key };
    if(r.note) it.note = r.note;
    if(r.blanks) it.blanks = r.blanks;
    if(r.manual) it.mark = hwCleanMark(r.mark);
    items[r.id] = it;
  });
  const res = hwSumReview(items), btn = $('gDone'); btn.disabled = true; setGmsg('送出中…', true);
  try{
    await updateDoc(doc(db, 'portal', uid, 'students', o.sid, 'hw', o.wid), { status: 'graded', result: res, review: { items, note: (g.note || '').trim(), hideScore: !!g.hideScore, gradedAt: Date.now() } });
    gradeClearLocal(o.sid, o.wid);
    gradeOpen = null; gdraft = null; gmsg = null; render(); window.scrollTo(0, 0);
  }catch(err){ console.error(err); btn.disabled = false; setGmsg('送出失敗，請再試一次', false); }
}

async function saveEmail(id, raw){

    if(!email){
      await deleteDoc(ref); delete roster[id]; rowMsg[id] = { text: '已清除', ok: true };
    }else{
      if(!EMAIL_RE.test(email)){ rowMsg[id] = { text: '電子郵件格式不正確', ok: false }; return render(); }
      const dup = Object.keys(roster).find(k => k !== id && roster[k].email === email);
      if(dup){ rowMsg[id] = { text: `這個電子郵件已經給了 ${students[dup] ? students[dup].name : '另一位學生'}`, ok: false }; return render(); }
      const data = { email, name: students[id] ? students[id].name : '', updatedAt: Date.now() };
      await setDoc(ref, data); roster[id] = data; rowMsg[id] = { text: '✓ 已儲存', ok: true };
    }
    delete drafts[id];
  }catch(err){
    console.error(err);
    rowMsg[id] = { text: err && err.code === 'permission-denied' ? '沒有權限：Firestore 規則還沒加 portal 那段' : '儲存失敗，請再試一次', ok: false };
  }
  render();
}

// 每位在學的學生各聽一份自己的作業進度
function syncHw(){
  const want = Object.keys(students).filter(id => !students[id].archived);
  Object.keys(hwUnsubs).forEach(id => { if(want.indexOf(id) < 0){ hwUnsubs[id](); delete hwUnsubs[id]; delete hw[id]; } });
  want.forEach(id => {
    if(hwUnsubs[id]) return;
    hwUnsubs[id] = onSnapshot(collection(db, 'portal', uid, 'students', id, 'hw'),
      snap => { hw[id] = {}; snap.forEach(d => hw[id][d.id] = d.data()); render(); },
      err => console.error(err));
  });
}
function stop(){ unsubs.forEach(u => u()); unsubs = []; Object.keys(hwUnsubs).forEach(id => hwUnsubs[id]()); hwUnsubs = {}; hw = {}; pool = {}; poolLoaded = false; admins = {}; }
function start(){
  stop(); students = {}; roster = {}; studentsLoaded = rosterLoaded = false; loadErr = '';
  const onErr = err => { console.error(err); loadErr = err && err.code === 'permission-denied' ? '沒有權限讀取：Firestore 規則還沒加 portal 那段（見 README）。' : '讀取失敗，請重新整理。'; render(); };
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'students'), snap => { students = {}; snap.forEach(d => students[d.id] = d.data()); studentsLoaded = true; syncHw(); render(); }, onErr));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'hwPool'), snap => { pool = {}; snap.forEach(d => pool[d.id] = d.data()); poolLoaded = true; render(); }, err => { console.error(err); poolLoaded = true; render(); }));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'admins'), snap => { admins = {}; snap.forEach(d => admins[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'roster'), snap => { roster = {}; snap.forEach(d => roster[d.id] = d.data()); rosterLoaded = true; render(); }, onErr));
}

$('btnLogout').onclick = () => signOut(auth);
onAuthStateChanged(auth, user => {
  authReady = true; uid = user ? user.uid : null; loginErr = ''; gradeOpen = null; gdraft = null;
  if(uid) start(); else { stop(); render(); }
  if(uid) render();
});
render();
</script>
