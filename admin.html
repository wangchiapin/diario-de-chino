<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>學生日誌管理後台 · Diario de chino</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--bg:#ece8df;--card:#f8f6f0;--line:#d9d3c5;--text:#3b372f;--sub:#7b7467;--accent:#7a6a50;--accent-soft:#e6dfd0;--ok:#5f7f63;--warn:#a04b3f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 50px}
/* 手機版：網頁固定成螢幕高度，內容區自己捲（避開 iPhone Chrome 往下捲後上面被切掉；做法同學生頁、「把」遊戲） */
@media (max-width:640px){
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh}
.wrap{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);width:100%}
button{font:inherit;font-size:14px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer}
button.quiet{background:transparent;color:var(--accent)}
button:disabled{opacity:.5}
.muted{color:var(--sub);font-size:13px}
details.help{margin:2px 0 8px}
details.help>summary{display:inline-block;cursor:pointer;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:1px 10px;list-style:none}
details.help>summary::-webkit-details-marker{display:none}
details.help[open]>summary{background:#f1f1f1}
details.help>.hb{margin-top:6px}
.err{color:var(--warn)} .ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:600}
td.em{min-width:210px}
.small{font-size:12px}
a.pv{font-size:13px;color:var(--accent);margin-left:6px}
.hwrow{border-top:1px solid var(--line);padding:10px 0}
.hwrow:first-of-type{border-top:0}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--accent-soft);margin:2px 4px 2px 0}
.chip.todo{background:#e8e4db;color:#7b7467}.chip.submitted{background:#f0e2c3;color:#5a4624}.chip.graded{background:#dbe7da;color:#35553a}
.picks label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:14px}
.picks input{width:auto}
button.tiny{font-size:12px;padding:3px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hidden{display:none !important}
ol{margin:6px 0 0 18px;padding:0}

/* 批改 */
.gbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.gbar .sc{font-size:18px;font-weight:600;margin-left:auto}
.gnote{background:#f0ece1;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.gi{padding:12px 0;border-top:1px solid var(--line)}
.gi:first-of-type{border-top:0}
.gi.need{background:#f7ebe6;border-radius:8px;padding:12px 8px}
.gq{font-size:17px;line-height:1.9}
.gq .no{color:var(--sub);font-size:13px;margin-right:6px}
.gq .es{font-size:13px;color:var(--sub);display:block}
.ga{margin-top:4px;font-size:16px}
.ga .lab,.gk .lab{font-size:12px;color:var(--sub);margin-right:6px}
.gk{margin-top:2px;font-size:15px;color:#5f7f63}
.gk .nt{display:block;font-size:12px;color:var(--sub)}
.gb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gb button{background:#fff;color:var(--text);border:1px solid var(--line);padding:6px 16px;min-width:64px}
.gb button.on.y{background:#dbe7da;border-color:#8fb293;color:#35553a;font-weight:600}
.gb button.on.h{background:#f0e2c3;border-color:#d2b97f;color:#5a4624;font-weight:600}
.gb button.on.n{background:#f0d9d3;border-color:#d39b8f;color:#8a3a2e;font-weight:600}
.gtools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.gtools button{background:#fff;color:var(--text);border:1px solid var(--line);padding:4px 11px;font-size:14px;border-radius:8px;min-width:36px}
.gtools .sep{font-size:12px;color:var(--sub);margin-left:4px}
.gedit{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:17px;line-height:1.8;min-height:50px;white-space:pre-wrap;outline:none}
.gedit:focus{border-color:var(--accent)}
.gblank{display:inline-block;padding:1px 9px;margin:2px 4px 2px 0;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff}
.gblank.y{background:#dbe7da;border-color:#8fb293}.gblank.n{background:#f0d9d3;border-color:#d39b8f}
.gnotebox{width:100%;min-height:70px;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.gmsg{font-size:13px;margin-top:6px}
.bbitem{padding:8px 0;border-top:1px solid var(--line)}
.bbitem .bbtx{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.bbme .bbtx{color:var(--accent)}
button .bd{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;text-align:center;margin-left:4px;padding:0 4px}
.lchip{display:inline-block;background:#ece7dc;border-radius:12px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
.nudta{width:100%;min-height:150px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;line-height:1.6}
.nudcols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nudrem{display:grid;grid-template-columns:110px 1fr 1fr 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.nudrem input{font-size:13px;padding:6px 8px}
details.nd{border-top:1px solid var(--line);padding:8px 0}
details.nd summary{cursor:pointer;font-size:14px}
@media (max-width:640px){.nudcols{grid-template-columns:1fr}.nudrem{grid-template-columns:1fr}}
.tabbar{display:flex;gap:6px;margin-bottom:12px}
/* 電腦版（寬螢幕）：左邊固定側邊選單、內容放右邊、表單並排。手機版的規則都在上面和下面，這裡不影響 */
@media (min-width:1024px){
.wrap:has(#tabbar){max-width:1280px}
#app:has(>#tabbar){display:grid;grid-template-columns:150px minmax(0,1fr);column-gap:20px;align-items:start}
#app>#tabbar{grid-column:1;position:sticky;top:12px;flex-direction:column;margin:0;gap:4px}
#app>#tabbar button{text-align:left;border-radius:10px;padding:10px 14px;border-color:transparent}
#app>#tabbar button.on{border-color:var(--accent)}
#app>.tabp{grid-column:2;min-width:0}
td.em{min-width:260px}
.tabp[data-p="stu"],.tabp[data-p="pub"]{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-items:start}
.tabp[data-p="stu"]>.card,.tabp[data-p="pub"]>.card{grid-column:1/-1}
.tabp[data-p="stu"]>.card.c-half,.tabp[data-p="pub"]>.card.half{grid-column:auto}
.tabp[data-p="voc"]{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(0,1.3fr);column-gap:14px;align-items:start}
.tabp[data-p="voc"]>.card{grid-column:1}
.tabp[data-p="voc"]>.card.vw{grid-column:2;grid-row:1 / span 8}
.tabp[data-p="set"]{max-width:760px}
.vw td:last-child{white-space:nowrap}
.vw td:last-child button{padding:5px 12px;font-size:13px}
.vw td{padding:6px 6px}
}
.svq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fff}
.svq.lock{background:#f3efe5}
.svq .svta{width:100%;min-height:44px;margin-top:6px}
.svopts{margin-top:6px}
.svo{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;margin:4px 0}
.svo input{font-size:14px;padding:6px 8px}
.svans{padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.svtr{color:var(--sub);font-size:13px;margin-top:2px;padding-left:8px;border-left:3px solid var(--line)}
.svg{font-size:12px;white-space:nowrap}
.svresp{padding:4px 0;border-top:1px solid var(--line)}
.svtblw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.svtbl{border-collapse:collapse;font-size:13px;min-width:100%}
.svtbl th,.svtbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;min-width:120px}
.svtbl th{position:sticky;top:0;background:#f3efe5;z-index:1}
.svtbl td:nth-child(-n+2),.svtbl th:nth-child(-n+2){min-width:90px}
.svbar{display:grid;grid-template-columns:minmax(80px,200px) 1fr 92px;gap:8px;align-items:center;margin:3px 0;font-size:14px}
.svtrack{display:block;background:#e8e4db;border-radius:6px;height:12px;overflow:hidden}
.svtrack i{display:block;height:100%;background:var(--accent)}
.svbn{text-align:right;color:var(--sub);font-size:13px}
@media (max-width:640px){.svo{grid-template-columns:1fr}.svbar{grid-template-columns:90px 1fr 80px}}
.tabbar button{background:transparent;color:var(--accent);position:relative}
.tabbar button.on{background:var(--accent);color:#fff}
.tabbar .bd{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;text-align:center;margin-left:5px;padding:0 4px}
@media (max-width:640px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(18px + env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{flex:1 0 auto;border:0;border-radius:10px;padding:10px 10px;font-size:13px;white-space:nowrap}
  .tabbar button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
  .wrap{padding-bottom:104px}
}
@media (max-width:640px){
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:8px;background:#fff}
  td{border:0;padding:3px 2px}
  td.em{min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>學生日誌管理後台</h1><button class="quiet hidden" id="btnLogout">登出</button></header>
  <div id="app"><div class="card muted">載入中…</div></div>
</div>
<script>function toTop(){window.scrollTo(0,0);var w=document.querySelector('.wrap');if(w)w.scrollTop=0}</script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js"></script>
<script src="vendor/opencc-t2cn.js"></script>
<script src="portal-hw.js"></script>
<script src="portal-nudge.js"></script>
<script src="portal-learn.js"></script>
<script src="grammar-map.js"></script>
<script src="portal-pinyin.js"></script>
<script src="portal-board.js"></script>
<script src="portal-survey.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, updateDoc, deleteField, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDB6zYAHvi0oTkObv-qDnP6nn0UUnscby0",
  authDomain: "moneybook-50481.firebaseapp.com",
  projectId: "moneybook-50481",
  storageBucket: "moneybook-50481.firebasestorage.app",
  messagingSenderId: "549256761796",
  appId: "1:549256761796:web:254332f109e7b8ad871491"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let reqs = {}, reqSel = {}, reqMsg = {};
let bbPosts = [], bbWall = [], bbDm = [], members = {}, membersLoaded = false, membersErr = false, memSyncing = false, dmSeen = {}, bbTab = 'board', bbOpened = {}, bbDraft = { board: '', reply: {} }, bbMsg = null;   // 公布欄、公開留言、私訊、學生名單鏡像
let placements = [], notes = {}, noteDraft = {}, noteMsg = '';   // placements：能力分級測驗結果；notes：老師專用的學生備註（學生讀不到）
let gmap = {};   // 老師手動分的語法點冊別：標題 → 冊（0＝不分類），存在 config/gmap
let lists = {}, marks = {}, vocSid = '', vocDraft = { w: '', p: '' }, vocMsg = null, vocShowHidden = false;   // lists：學生代號 → 老師為他存的單字／語法清單；marks：學生標的「還不熟」
let adminTab = (function(){ try{ return localStorage.getItem('dc.adminTab') || 'stu'; }catch(e){ return 'stu'; } })();
const helpOpen = new Set();
function helpBox(k, inner){ return `<details class="help" data-hk="${k}" ${helpOpen.has(k) ? 'open' : ''}><summary>說明</summary><div class="hb muted small">${inner}</div></details>`; }
document.addEventListener('toggle', e => { const d = e.target; if(d && d.classList && d.classList.contains('help')){ if(d.open) helpOpen.add(d.dataset.hk); else helpOpen.delete(d.dataset.hk); } }, true);
let surveys = {}, svRounds = {}, sv = {}, svUnsubs = {}, svEdit = null, svMsg = null, svPub = null, svView = null, svResps = [], svMode = 'q', svTr = {}, svTrMsg = '';   // 問卷：surveys 老師的問卷；svRounds 發布紀錄；sv：學生代號 → { 發布代號 → 學生那份 }
let nudCfg = null, nudDraft = null, nudOpen = false, nudMsg = null, nudRowMsg = {};
let uid = null, students = {}, roster = {}, studentsLoaded = false, rosterLoaded = false, loadErr = '';
let unsubs = [];
let pool = {}, poolLoaded = false, admins = {}, hw = {}, hwUnsubs = {};   // hw：學生代號 → { 作業代號 → 文件 }
let delOpen = null, delInfo = {}, delOk = {}, delBusy = false;
let assignOpen = null, assignSel = {}, hwNote = {}, adminDraft = { code: '', label: '' }, adminMsg = null;
const poolCache = {};
let gradeOpen = null, gdraft = null, gmsg = null;   // 批改中：{sid,wid}、批改草稿
let rowMsg = {};          // 學生代號 → {text, ok}
let drafts = {};          // 學生代號 → 還沒儲存的電子郵件
let authReady = false, loginErr = '';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function payText(s){
  if(s.pay === 'package') return s.remaining != null ? (s.remaining < 0 ? `包堂・已超過 ${-s.remaining} 堂` : `包堂・剩 ${s.remaining} 堂`) : '包堂';
  if(s.pay === 'single') return '單堂付費';
  return '—';
}
function spanCell(s){
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(String(s.since || '')) ? s.since : '';
  const d = new Date(), today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const t = iso ? nudSpan(iso, today, 'tc') : '';
  return t ? `<div>${esc(t)}</div><div class="muted">${esc(iso)}</div>` : '<span class="muted">—</span>';
}
function fmtTime(ms){
  if(!ms) return '—';
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function studentUrl(){ return location.href.replace(/admin\.html.*$/, '') + '?t=' + uid; }

function poolState(id){
  const p = pool[id]; if(!p) return null;
  const key = id + ':' + (p.upd || p.ts || 0);
  if(!poolCache[key]){ try{ poolCache[key] = JSON.parse(p.data); }catch(e){ poolCache[key] = {}; } }
  return poolCache[key];
}
function hwChip(d){
  if(!d) return '';
  if(d.status === 'graded') return `<span class="chip graded">已批改${d.result ? ' ' + esc(d.result.got) + '/' + esc(d.result.max) : ''}</span>`;
  if(d.status === 'submitted') return '<span class="chip submitted">已交，待批改</span>';
  return '<span class="chip todo">未交</span>';
}
function pendingHtml(active){
  const list = [];
  active.forEach(sid => Object.keys(hw[sid] || {}).forEach(wid => { const d = hw[sid][wid]; if(d.status === 'submitted') list.push({ sid, wid, d }); }));
  if(!list.length) return '';
  list.sort((a, b) => (a.d.submittedAt || 0) - (b.d.submittedAt || 0));
  return `<div class="card"><h2>等你批改（${list.length}）</h2>${list.map(x => `<div class="row" style="padding:5px 0"><b>${esc(students[x.sid].name)}</b><span class="muted">${esc(x.d.title || '')}</span><span class="muted small">${esc(fmtTime(x.d.submittedAt))} 交</span><button class="tiny" data-g="${esc(x.sid)}" data-gw="${esc(x.wid)}">批改</button></div>`).join('')}</div>`;
}
/* ───────── 新註冊（學生驗證信箱後留下的申請，老師選是哪位學生） ───────── */
function pendingReqs(){
  const have = {}; Object.keys(roster).forEach(k => { if(roster[k].email) have[roster[k].email] = 1; });
  return Object.keys(reqs).filter(k => reqs[k].email && !have[String(reqs[k].email).toLowerCase()]).sort((a, b) => (reqs[a].at || 0) - (reqs[b].at || 0));
}
function reqHtml(active){
  const list = pendingReqs();
  if(!list.length) return '';
  const free = active.filter(sid => !roster[sid] || !roster[sid].email);
  return `<div class="card"><h2>新註冊（${list.length}）</h2>
    ${helpBox('rq', '這些人已經用學生網址註冊並驗證了信箱。請選出他是哪位學生，按「確認」，他就能看到自己的資料。不認識的人按「忽略」。')}
    ${list.map(k => { const r = reqs[k], m = reqMsg[k];
      return `<div class="hwrow" data-rq="${esc(k)}"><div class="row"><b style="word-break:break-all">${esc(r.email)}</b><span class="muted small">${esc(fmtTime(r.at))}</span></div>
        <div class="row" style="margin-top:6px"><select class="rqSel" style="font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%"><option value="">選擇是哪位學生…</option>${free.map(sid => `<option value="${esc(sid)}" ${reqSel[k] === sid ? 'selected' : ''}>${esc(students[sid].name)}</option>`).join('')}</select>
        <button class="tiny rqOk">確認</button><button class="tiny quiet rqNo">忽略</button><span class="small ${m && !m.ok ? 'err' : 'ok'}">${esc(m ? m.text : '')}</span></div>
        ${free.length ? '' : '<div class="muted small">每位學生都已經有電子郵件了。如果要換，請先在下面的表格改。</div>'}</div>`; }).join('')}</div>`;
}
function bindReq(root){
  root.querySelectorAll('[data-rq]').forEach(el => {
    const k = el.dataset.rq;
    el.querySelector('.rqSel').onchange = e => { reqSel[k] = e.target.value; };
    el.querySelector('.rqOk').onclick = () => confirmReq(k, el.querySelector('.rqSel').value);
    el.querySelector('.rqNo').onclick = async () => {
      if(!confirm('要忽略這個註冊嗎？（對方的帳號不會被刪除，只是不會出現在名單上；他再開頁面時會再通知你一次）')) return;
      try{ await deleteDoc(doc(db, 'portal', uid, 'requests', k)); delete reqs[k]; delete reqSel[k]; delete reqMsg[k]; }
      catch(err){ console.error(err); reqMsg[k] = { text: '失敗，請再試一次', ok: false, sid }; }
      render();
    };
  });
}
async function confirmReq(k, sid){
  const r = reqs[k]; if(!r) return;
  if(!sid){ reqMsg[k] = { text: '請先選一位學生', ok: false }; return render(); }
  const email = String(r.email || '').toLowerCase();
  const dup = Object.keys(roster).find(x => x !== sid && roster[x].email === email);

const VOC_MAX = 1500;

}
function vocFindEn(zh){
  for(const sid of Object.keys(students)){
    const w = learnTotals(hw[sid] || {}, vocList(sid)).words.find(x => x.zh === zh && x.en);
    if(w) return w.en;

// 輸入一批：一行一個；「中文 西文」或只有中文；全中文的行可用頓號、逗號分開
function vocParse(txt){
  const out = [];
  String(txt || '').split('\n').forEach(line => {
    line = line.trim(); if(!line) return;
    // 「中文 西文 ｜ 英文」：｜（或 |）後面是英文意思；先切掉，剩下照原本的方式解析
    let en = '';
    const bar = line.search(/[｜|]/);
    if(bar >= 0){ en = line.slice(bar + 1).replace(/[｜|]/g, ',').trim(); line = line.slice(0, bar).trim(); }
    if(/^[㐀-鿿、，,\s]+$/.test(line)) line = line.replace(/[、，,]/g, '\n');
    const got = nudParseVocab(line);
    if(en && got.length === 1) got[0].en = en;
    got.forEach(v => out.push(v));
  });
  return out;
}

以下是要翻譯的單字：

function bindVoc(root){
  const sel = root.querySelector('#vocSel'); if(!sel) return;
  const sid = vocSid;
  sel.onchange = e => { vocSid = e.target.value; vocMsg = null; noteMsg = ''; render(); };
  const nt = root.querySelector('#noteTx'); if(nt) nt.oninput = e => { noteDraft[sid] = e.target.value; };
  const ns = root.querySelector('#noteSave'); if(ns) ns.onclick = async () => {
    const text = (root.querySelector('#noteTx').value || '').trim().slice(0, 2000);
    try{
      if(text) await setDoc(doc(db, 'portal', uid, 'notes', sid), { text, updatedAt: Date.now() }); else await deleteDoc(doc(db, 'portal', uid, 'notes', sid));
      noteMsg = '✓ 已儲存'; delete noteDraft[sid];
    }catch(err){ console.error(err); noteMsg = err && err.code === 'permission-denied' ? '沒有權限：Firestore 規則還沒加第十批（見 README）' : '儲存失敗，請再試一次'; }
    render();
  };
  const ta = root.querySelector('#vocW'), tp = root.querySelector('#vocP');
  ta.oninput = e => { vocDraft.w = e.target.value; }; tp.oninput = e => { vocDraft.p = e.target.value; };
  const on = (id, f) => { const e = root.querySelector('#' + id); if(e) e.onclick = f; };
  on('vocPrompt', async () => {
    const b = root.querySelector('#vocPrompt'); let ok = true;
    try{ await navigator.clipboard.writeText(VOC_PROMPT); }
    catch(e){ const t = document.createElement('textarea'); t.value = VOC_PROMPT; document.body.appendChild(t); t.select(); try{ ok = document.execCommand('copy'); }catch(e2){ ok = false; } t.remove(); }
    b.textContent = ok ? '已複製，貼給 AI 就好' : '複製失敗'; setTimeout(() => { if(b.isConnected) b.textContent = '複製 AI 提示詞'; }, 2500);
  });
  on('vocAdd', () => {
    const items = vocParse(ta.value);
    if(!items.length){ vocMsg = { text: '請輸入中文單字', ok: false }; return render(); }
    const have = {}; vocList(sid).words.forEach(w => { have[w.zh] = w; });
    const res = items.map(v => { const r = { zh: v.zh, es: v.es || (have[v.zh] && have[v.zh].es) || vocFindEs(v.zh), py: vocPy(v.zh) }; const en = v.en || (have[v.zh] && have[v.zh].en) || vocFindEn(v.zh); if(en) r.en = en; return r; });
    const noEs = res.filter(r => !r.es).length;
    vocSave(sid, cur => {
      let added = 0;
      res.forEach(r => {
        const i = cur.words.findIndex(w => w.zh === r.zh);
        if(i >= 0) cur.words[i] = Object.assign({}, cur.words[i], r);
        else cur.words.push(Object.assign({}, r, { t: Date.now() + added++ }));
        const h = cur.hideW.indexOf(r.zh); if(h >= 0) cur.hideW.splice(h, 1);
      });
    }, `✓ 已加入 ${res.length} 個${noEs ? `（${noEs} 個查不到西文意思，請在下面自己填）` : ''}`).then(() => { vocDraft.w = ''; });
  });
  on('stSave', () => {
    const cefr = root.querySelector('#stCefr').value, w = Math.max(0, Math.min(20000, parseInt(root.querySelector('#stWords').value, 10) || 0));
    vocSave(sid, cur => { if(!cefr && !w) delete cur.start; else cur.start = { cefr, words: w }; }, '✓ 起始程度已儲存');
  });
  root.querySelectorAll('.gmSel').forEach(el => { el.onchange = async () => {
    if(el.value === '') return;
    const m = Object.assign({}, gmap); m[el.dataset.n] = +el.value;
    try{ await setDoc(doc(db, 'portal', uid, 'config', 'gmap'), { map: m, updatedAt: Date.now() }); gmap = m; vocMsg = { text: '✓ 已記住', ok: true }; }
    catch(err){ console.error(err); vocMsg = { text: '儲存失敗，請再試一次', ok: false }; }
    render();
  }; });
  on('vocAddP', () => {
    const pts = tp.value.split('\n').reduce((a, l) => a.concat(nudSplitPoints(l)), []);
    if(!pts.length){ vocMsg = { text: '請輸入語法點', ok: false }; return render(); }
    const known = {}; vocTotals(sid).points.forEach(x => { known[x.n] = 1; });
    vocSave(sid, cur => { pts.forEach(n => { if(!known[n] && !cur.points.some(x => x.n === n)) cur.points.push({ n, t: Date.now() }); const h = cur.hideP.indexOf(n); if(h >= 0) cur.hideP.splice(h, 1); }); }, `✓ 已加入語法點`).then(() => { vocDraft.p = ''; });
  });
  on('vocFill', () => {
    const miss = vocTotals(sid).words.filter(w => !w.py);
    vocSave(sid, cur => { miss.forEach(w => { const py = vocPy(w.zh); if(!py) return; const i = cur.words.findIndex(x => x.zh === w.zh); if(i >= 0) cur.words[i].py = py; else cur.words.push({ zh: w.zh, py, es: '' }); }); }, '✓ 已補上拼音');
  });
  root.querySelectorAll('tr[data-z]').forEach(tr => {
    const zh = tr.dataset.z;
    tr.querySelector('.vSave').onclick = () => {
      const py = tr.querySelector('.vPy').value.trim(), es = tr.querySelector('.vEs').value.trim(), en = tr.querySelector('.vEn').value.trim();
      vocSave(sid, cur => { const i = cur.words.findIndex(w => w.zh === zh); if(i >= 0) Object.assign(cur.words[i], { py, es, en }); else cur.words.push({ zh, py, es, en }); });
    };
    tr.querySelector('.vHide').onclick = () => {
      const mine = vocList(sid).words.find(w => w.zh === zh), own = mine && vocTotals(sid).words.find(w => w.zh === zh).src === 'tc';
      vocSave(sid, cur => { if(own) cur.words = cur.words.filter(w => w.zh !== zh); else if(cur.hideW.indexOf(zh) < 0) cur.hideW.push(zh); }, own ? '✓ 已刪除' : '✓ 已隱藏（學生看不到）');
    };
  });
  root.querySelectorAll('.vpHide').forEach(b => b.onclick = () => {
    const n = b.parentNode.dataset.n, own = vocTotals(sid).points.find(x => x.n === n).src === 'tc';
    vocSave(sid, cur => { if(own) cur.points = cur.points.filter(x => x.n !== n); else if(cur.hideP.indexOf(n) < 0) cur.hideP.push(n); }, own ? '✓ 已刪除' : '✓ 已隱藏');
  });
  root.querySelectorAll('.vUn').forEach(b => b.onclick = () => {
    vocShowHidden = true;
    vocSave(sid, cur => { const k = b.dataset.k === 'w' ? 'hideW' : 'hideP'; cur[k] = cur[k].filter(z => z !== b.dataset.z); }, '✓ 已還原');
  });
  const hd = root.querySelector('#vocHid'); if(hd) hd.addEventListener('toggle', () => { vocShowHidden = hd.open; });
}

async function sendAssign(wid){

/* ───────── 批改畫面 ───────── */
const NUMZH = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const MANUAL = { translate: 1, zh2es: 1, sentence: 1 };
function nl2br(t){ return esc(t).replace(/\n/g, '<br>'); }

// 把這份作業整理成一題一題：題目、學生答案、標準答案、分數
function gradeItems(sid, wid){
  const st = poolState(wid), d = (hw[sid] || {})[wid]; if(!st || !st.sections || !d) return null;
  const ans = d.answers || {}, auto = hwAutoGrade(st, ans), old = d.review && d.review.items || {};
  const list = [];
  hwActiveSections(st).forEach((sec, si) => {
    const items = hwActiveItems(sec), perm = sec.type === 'match' ? hwMatchPerm(items) : null;
    items.forEach((it, qi) => {
      const a = ans[it.id], au = auto.items[it.id], o = old[it.id], t = sec.type;
      let q = '', es = '', mine = '';
      if(t === 'fill'){ q = esc(it.zh || '').replace('__', '＿＿＿'); es = it.es || ''; mine = a || ''; }
      else if(t === 'cloze'){ q = esc(it.text || '').replace(/\{(\d+)\}/g, '（$1）'); mine = Array.isArray(a) ? a.map(x => x || '＿').join('、') : ''; }
      else if(t === 'order'){ q = esc((it.tokens || []).join(' ／ ')); es = it.es || ''; mine = Array.isArray(a) ? a.join('') : ''; }
      else if(t === 'choice'){ q = esc(it.es || ''); es = (it.options || []).map((x, i) => hwLetter(i) + ' ' + x).join('　'); mine = typeof a === 'number' ? hwLetter(a) + '　' + ((it.options || [])[a] || '') : ''; }
      else if(t === 'fix'){ q = esc(it.wrong || ''); mine = a || ''; }
      else if(t === 'translate'){ q = esc(it.es || ''); mine = a || ''; }
      else if(t === 'zh2es'){ q = esc(it.zh || ''); mine = a || ''; }
      else if(t === 'sentence'){ q = esc(it.cue || ''); es = it.es || ''; mine = a || ''; }
      else if(t === 'match'){ q = esc(it.zh || ''); const r = typeof a === 'number' && perm[a] != null ? items[perm[a]] : null; mine = r ? hwLetter(a) + '　' + r.es : ''; }
      const row = { id: it.id, type: t, no: qi + 1, secNo: si, first: qi === 0, q, es, mine, key: hwKeyText(t, it), keyEn: hwKeyTextEn(t, it), note: String(it.note || it.tip || ''), max: au.max, manual: !au.auto,
        got: au.auto ? au.got : null, blanks: au.blanks ? au.blanks.slice() : null, mark: MANUAL[t] ? nl2br(mine) : '' };
      if(o){ if(o.got != null) row.got = o.got; if(o.blanks) row.blanks = o.blanks.slice(); if(typeof o.mark === 'string' && o.mark) row.mark = o.mark; }
      list.push(row);
    });
  });
  return { list, secs: hwActiveSections(st).map(sc => sc.type), note: d.review && d.review.note || '', hideScore: !!(d.review && d.review.hideScore) };
}
const GDKEY = (sid, wid) => 'dc.grade.' + uid + '.' + sid + '.' + wid;
function gradeSaveLocal(){ if(!gradeOpen || !gdraft) return;
  if(gdraft.word){ try{ localStorage.setItem(GDKEY(gradeOpen.sid, gradeOpen.wid), JSON.stringify({ word: 1, t: Date.now(), mark: gdraft.list[0].mark, got: gdraft.wordGot, note: gdraft.note, hide: !!gdraft.hideScore })); }catch(e){} return; }
  try{ localStorage.setItem(GDKEY(gradeOpen.sid, gradeOpen.wid), JSON.stringify({ t: Date.now(), items: gdraft.list.map(r => ({ id: r.id, got: r.got, blanks: r.blanks, mark: r.mark })), note: gdraft.note, hide: !!gdraft.hideScore })); }catch(e){} }
function gradeLoadLocal(sid, wid, g){
  try{
    const d = (hw[sid] || {})[wid], raw = localStorage.getItem(GDKEY(sid, wid)); if(!raw || !d || d.status !== 'submitted') return false;
    const sv = JSON.parse(raw), by = {}; sv.items.forEach(x => by[x.id] = x);
    g.list.forEach(r => { const x = by[r.id]; if(!x) return; if(x.got != null) r.got = x.got; if(x.blanks) r.blanks = x.blanks; if(typeof x.mark === 'string') r.mark = x.mark; });
    g.note = sv.note || ''; g.hideScore = !!sv.hide; return true;
  }catch(e){ return false; }
}

function loadJs(src){
  return new Promise((res, rej) => {
    if(window.__loaded && window.__loaded[src]) return res();
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => { (window.__loaded = window.__loaded || {})[src] = 1; res(); }; sc.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(sc);
  });
}
async function openGrade(sid, wid){
  const d0 = (hw[sid] || {})[wid], st = poolState(wid);
  if(!st || !st.sections || !d0){ alert('這份作業的內容讀不出來，請回練習單產生器重新發布。'); return; }
  // 學生有上傳 Word 嗎？有的話用「看 Word、標記、給總分」的方式批改
  let fileDoc = null;
  try{ const f = await getDoc(doc(db, 'portal', uid, 'students', sid, 'hwFiles', wid)); if(f.exists()) fileDoc = f.data(); }catch(err){ console.error(err); }
  if(fileDoc && !(d0.review && d0.review.items)){ return openWordGrade(sid, wid, fileDoc, st); }
  const g = gradeItems(sid, wid);
  if(!g){ alert('這份作業的內容讀不出來，請回練習單產生器重新發布。'); return; }
  const restored = gradeLoadLocal(sid, wid, g);

/* ───── 把學生的回答翻成繁體中文（Chrome 內建翻譯；不能用就用每則旁邊的 Google 翻譯連結）───── */
const svTrCache = {};
let svDet = null;
const svHasChromeTr = () => 'Translator' in self;
async function svDetect(text, fb){
  try{
    if(!('LanguageDetector' in self)) return fb;
    if(!svDet){ if((await LanguageDetector.availability()) === 'unavailable') return fb; svDet = await LanguageDetector.create(); }
    const res = await svDet.detect(text), top = res && res[0];
    return top && top.confidence > 0.5 ? top.detectedLanguage : fb;
  }catch(e){ return fb; }
}
async function svTranslator(sl){
  if(svTrCache[sl]) return svTrCache[sl];
  const o = { sourceLanguage: sl, targetLanguage: 'zh-Hant' };
  try{
    if((await Translator.availability(o)) === 'unavailable') return null;
    o.monitor = m => m.addEventListener('downloadprogress', e => { svTrMsg = '正在下載翻譯模型 ' + Math.round(e.loaded * 100) + '%（只有第一次）'; const el = document.getElementById('svTrMsg'); if(el) el.textContent = svTrMsg; });
    return svTrCache[sl] = await Translator.create(o);
  }catch(e){ console.error(e); return null; }
}
async function svTrRun(rid, qid){
  const r = svRounds[rid]; if(!r) return;
  if(!svHasChromeTr()){ svTrMsg = '這個瀏覽器沒有內建翻譯（要電腦版 Chrome 138 以上）。請點每則回答旁邊的「Google 翻譯」。'; return render(); }
  const items = [];
  svRoundEntries(rid).filter(e => e.status === 'submitted').forEach(e => r.qs.forEach(q => {
    if(q.t !== 'text' || (qid && q.id !== qid)) return;
    const a = e.answers[q.id];
    if(typeof a === 'string' && a.trim() && !svLooksChinese(a)) items.push({ k: rid + '|' + e.key + '|' + q.id, text: a });
  }));
  const todo = items.filter(x => svTr[x.k] == null);
  if(!todo.length){ svTrMsg = items.length ? '都已經翻譯好了' : '沒有需要翻譯的回答'; return render(); }
  svTrMsg = '翻譯中…'; render();
  const fb = r.fl === 'en' ? 'en' : 'es';
  let ok = 0, bad = 0;
  for(const x of todo){
    try{
      const sl = await svDetect(x.text, fb);
      if(sl === 'zh' || sl === 'zh-Hant'){ continue; }
      const tr = await svTranslator(sl);
      if(!tr){ bad++; continue; }
      svTr[x.k] = await tr.translate(x.text); ok++;
    }catch(e){ console.error(e); bad++; }
  }
  svTrMsg = `已翻譯 ${ok} 則` + (bad ? `，${bad} 則 Chrome 翻不了，請用旁邊的「Google 翻譯」` : '');
  render();
}

    <div class="row" style="margin-top:10px"><button id="svSave">儲存</button><button class="quiet" id="svCancel">取消</button><span class="small ${svMsg && svMsg.ok ? 'ok' : 'err'}">${esc(svMsg ? svMsg.text : '')}</span></div></div>`;
}
function bindSvEdit(root){
  const box = root.querySelector('#svEdit'); if(!box || !svEdit) return;
  const d = svEdit.draft;
  $('svTitle').oninput = e => { d.title = e.target.value; };
  box.querySelectorAll('#svIntroBox textarea[data-ik]').forEach(t => t.oninput = () => { d.intro[t.dataset.ik] = t.value; });
  box.querySelector('#svIntroBox [data-a="introdef"]').onclick = () => { const cur = d.intro; if((cur.zh || cur.es || cur.en) && !confirm('目前的開頭會被預設開頭取代，確定嗎？')) return; d.intro = svDefaultIntro(); svMsg = null; render(); };
  box.querySelectorAll('.svq[data-qi]').forEach(card => {
    const i = +card.dataset.qi, q = d.questions[i];
    card.querySelectorAll('textarea[data-k]').forEach(t => t.oninput = () => { q[t.dataset.k] = t.value; });
    const sel = card.querySelector('select[data-k="t"]');
    sel.onchange = () => {
      q.t = sel.value;
      if(q.t === 'scale' && (!q.opts || !q.opts.length)) q.opts = svBlankQ('scale').opts;
      if((q.t === 'single' || q.t === 'multi') && (!q.opts || q.opts.length < 2)) q.opts = svBlankQ('single').opts;
      render();
    };
    card.querySelectorAll('.svo').forEach(row => {
      const j = +row.dataset.oi;
      row.querySelectorAll('input[data-ok]').forEach(inp => inp.oninput = () => { q.opts[j][inp.dataset.ok] = inp.value; });
    });
    card.querySelectorAll('button[data-a]').forEach(b => b.onclick = e => {
      const a = b.dataset.a, j = b.closest('.svo') ? +b.closest('.svo').dataset.oi : -1;
      if(a === 'qup' && i > 0) d.questions.splice(i - 1, 0, d.questions.splice(i, 1)[0]);
      else if(a === 'qdown' && i < d.questions.length - 1) d.questions.splice(i + 1, 0, d.questions.splice(i, 1)[0]);
      else if(a === 'qdel'){ if(!confirm('刪除第 ' + (i + 1) + ' 題？')) return; d.questions.splice(i, 1); }
      else if(a === 'oadd') q.opts.push(svBlankOpt());
      else if(a === 'odel'){ if(q.opts.length <= 2){ svSetMsg('選項至少要 2 個', false); return render(); } q.opts.splice(j, 1); }
      else if(a === 'oup' && j > 0) q.opts.splice(j - 1, 0, q.opts.splice(j, 1)[0]);
      svMsg = null; render();
    });
  });
  box.querySelector('[data-a="qadd"]').onclick = () => { if(d.questions.length >= SV_Q_MAX){ svSetMsg('一份問卷最多 ' + SV_Q_MAX + ' 題', false); return render(); } d.questions.push(svBlankQ('text')); svMsg = null; render(); };
  $('svSave').onclick = svSaveEdit;
  $('svCancel').onclick = () => { if(!confirm('不儲存，直接離開？')) return; svEdit = null; svMsg = null; render(); };
}

  }else{

      }else{
        b = (q.opts || []).map(o => {

function bindSv(root, active){
  bindSvEdit(root);

  pane.querySelectorAll('[data-a="newTpl"]').forEach(b => b.onclick = () => svCreate('tpl'));
  pane.querySelectorAll('[data-a="newBlank"]').forEach(b => b.onclick = () => svCreate('blank'));
  pane.querySelectorAll('.hwrow[data-svid]').forEach(row => {
    const id = row.dataset.svid;
    row.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if(a === 'edit'){ svEdit = { id, draft: { title: surveys[id].title, intro: svIntroClean(surveys[id].intro), questions: JSON.parse(JSON.stringify(surveys[id].questions || [])) } }; svMsg = null; svPub = null; render(); toTop(); }
      else if(a === 'copy') svCreate('copy', id);
      else if(a === 'del') svDelete(id);
      else if(a === 'pub'){ svPub = svPub && svPub.id === id ? null : { id, zh: 'tc', fl: 'es', sel: {} }; svMsg = null; render(); }
      else if(a === 'all'){ active.forEach(sid => { svPub.sel[sid] = true; }); render(); }
      else if(a === 'send') svSend();
      else if(a === 'pubLink') svPublish();
    });
    row.querySelectorAll('input[name="svzh"]').forEach(i => i.onchange = () => { svPub.zh = i.value; });
    row.querySelectorAll('input[name="svfl"]').forEach(i => i.onchange = () => { svPub.fl = i.value; });
    row.querySelectorAll('input[data-sid]').forEach(i => i.onchange = () => { svPub.sel[i.dataset.sid] = i.checked; });
  });
  pane.querySelectorAll('.hwrow[data-rid]').forEach(row => {
    const rid = row.dataset.rid;
    row.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      if(b.dataset.a === 'res'){ svView = svView === rid ? null : rid; render(); }
      else if(b.dataset.a === 'delr') svDeleteRound(rid);
    });
  });
  pane.querySelectorAll('#svRes [data-a="resClose"]').forEach(b => b.onclick = () => { svView = null; render(); });
  pane.querySelectorAll('#svRes [data-a="reopen"]').forEach(b => b.onclick = () => svReopen(b.dataset.sid, svView));
  pane.querySelectorAll('#svRes [data-a="mode"]').forEach(b => b.onclick = () => { svMode = b.dataset.m; render(); });
  pane.querySelectorAll('#svRes [data-a="xlsx"]').forEach(b => b.onclick = () => svExport(svView));
  pane.querySelectorAll('#svRes [data-a="trall"]').forEach(b => b.onclick = () => svTrRun(svView, ''));
  pane.querySelectorAll('#svRes [data-a="trq"]').forEach(b => b.onclick = () => svTrRun(svView, b.dataset.qid));
  pane.querySelectorAll('#svRes [data-a="toggleopen"]').forEach(b => b.onclick = () => svToggleOpen(svView));
  pane.querySelectorAll('#svRes [data-a="copylink"]').forEach(b => b.onclick = async () => { try{ await navigator.clipboard.writeText(svLinkUrl(svView)); b.textContent = '已複製'; }catch(e){ const i = $('svLink'); if(i) i.select(); } });
  pane.querySelectorAll('#svRes select[data-a="match"]').forEach(sel => sel.onchange = () => svMatch(sel.dataset.id, sel.value));
  pane.querySelectorAll('#svRes [data-a="delresp"]').forEach(b => b.onclick = () => svDelResp(b.dataset.id));
}

      <table><thead><tr><th>學生</th><th>付費</th><th>已上</th><th>上了多久</th><th>時區</th><th>日誌更新</th><th>中文字</th><th>登入用電子郵件</th><th></th></tr></thead><tbody>`;
    active.forEach(id => {
      const s = students[id], r = roster[id], m = rowMsg[id];
      html += `<tr data-id="${esc(id)}">
        <td><b>${esc(s.name)}</b></td><td${s.pay === 'package' && s.remaining < 0 ? ' class="err"' : ''}>${esc(payText(s))}</td><td>${s.taught || 0} 堂</td>
        <td class="small" style="white-space:nowrap">${spanCell(s)}</td>
        <td class="small">${esc(s.tz || '（沒設定）')}</td><td class="small">${esc(fmtTime(s.updatedAt))}</td>
        <td>${r ? `<select class="zhSel" title="學生頁一打開時的中文字；學生自己改過就以他的為準"><option value="sc"${r.script !== 'tc' ? ' selected' : ''}>簡體</option><option value="tc"${r.script === 'tc' ? ' selected' : ''}>繁體</option></select>` : '<span class="muted small">—</span>'}</td>
        <td class="em"><input type="email" class="emIn" value="${esc(drafts[id] != null ? drafts[id] : (r ? r.email : ''))}" placeholder="student@example.com" autocapitalize="off"></td>
        <td><button class="save">儲存</button> <a class="pv" href="index.html?preview=${encodeURIComponent(id)}" target="_blank" rel="noopener">預覽</a><div class="small ${m && !m.ok ? 'err' : 'ok'}">${esc(m ? m.text : (r ? '已設定' : ''))}</div></td></tr>`;
    });
    html += `</tbody></table></div>`;
    if(archived.length) html += `<div class="card"><details><summary class="muted">已停課的學生（${archived.length} 位）</summary><div class="small muted" style="margin-top:6px">${archived.map(id => esc(students[id].name)).join('、')}　（他們看不到任何資料）</div></details></div>`;
  }
  const pend = active.reduce((n, sid) => n + Object.keys(hw[sid] || {}).filter(w => hw[sid][w].status === 'submitted').length, 0);
  const reqN = pendingReqs().length;
  const bbUnreadTotal = (() => { const u = bbUnread(); return Object.keys(u).reduce((n, k) => n + u[k], 0); })();
  const TABS = [['stu', '學生'], ['hw', '作業'], ['voc', '單字'], ['plc', '測驗'], ['sv', '問卷'], ['pub', '公布'], ['nud', '彈跳視窗'], ['set', '設定']];
  if(!TABS.some(t => t[0] === adminTab)) adminTab = 'stu';
  const pane = (k, h) => `<section class="tabp ${adminTab === k ? '' : 'hidden'}" data-p="${k}">${h}</section>`;
  root.innerHTML = `<nav class="tabbar" id="tabbar">${TABS.map(t => `<button class="${adminTab === t[0] ? 'on' : ''}" data-t="${t[0]}">${t[1]}${t[0] === 'pub' && bbUnreadTotal ? `<span class="bd">${bbUnreadTotal}</span>` : ''}${t[0] === 'hw' && pend ? `<span class="bd">${pend}</span>` : ''}${t[0] === 'stu' && reqN ? `<span class="bd">${reqN}</span>` : ''}</button>`).join('')}</nav>`
    + pane('stu', reqHtml(active) + html) + pane('hw', hwHtml(active)) + pane('voc', vocHtml(active)) + pane('plc', plcHtml(active)) + pane('sv', svHtml(active)) + pane('pub', bbHtml(active)) + pane('nud', nudHtml(active)) + pane('set', pubHtml());
  root.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => {
    adminTab = b.dataset.t; try{ localStorage.setItem('dc.adminTab', adminTab); }catch(e){}
    root.querySelectorAll('#tabbar button').forEach(x => x.classList.toggle('on', x === b));
    root.querySelectorAll('.tabp').forEach(x => x.classList.toggle('hidden', x.dataset.p !== adminTab));
    toTop();
  });
  bindHw(root, active); bindSv(root, active); bindNud(root); bindReq(root); bindVoc(root); bindBb(root);
  root.querySelectorAll('tr[data-pid] .plDel').forEach(b => b.onclick = async () => {
    const id = b.closest('tr').dataset.pid;
    if(!confirm('刪除這筆測驗結果？')) return;
    try{ await deleteDoc(doc(db, 'portal', uid, 'placements', id)); }catch(err){ console.error(err); alert('刪除失敗'); }
  });

  const pc = $('plCopy'); if(pc) pc.onclick = async () => { try{ await navigator.clipboard.writeText(placementUrl()); pc.textContent = '已複製'; }catch(e){ $('plLink').select(); } };
  const pe = $('plCopyEn'); if(pe) pe.onclick = async () => { try{ await navigator.clipboard.writeText(placementUrl() + '&lang=en'); pe.textContent = '已複製'; }catch(e){ $('plLinkEn').select(); } };
  const c = $('copy'); if(c) c.onclick = async () => { try{ await navigator.clipboard.writeText(studentUrl()); c.textContent = '已複製'; }catch(e){ $('link').select(); } };
  root.querySelectorAll('tr[data-id]').forEach(tr => {
    const id = tr.dataset.id;
    // 還沒按「儲存」的字先記著，日誌更新、畫面重畫時才不會被洗掉
    tr.querySelector('.emIn').oninput = e => { drafts[id] = e.target.value; };
    tr.querySelector('.save').onclick = () => saveEmail(id, tr.querySelector('.emIn').value);
    const zs = tr.querySelector('.zhSel');
    if(zs) zs.onchange = async () => {
      try{ await updateDoc(doc(db, 'portal', uid, 'roster', id), { script: zs.value }); roster[id] = Object.assign({}, roster[id], { script: zs.value }); rowMsg[id] = { text: '✓ 預設中文字已存', ok: true }; }
      catch(err){ console.error(err); rowMsg[id] = { text: '儲存失敗，請再試一次', ok: false }; }
      render();
    };
  });
}

async function saveEmail(id, raw){
  const email = String(raw || '').trim().toLowerCase();
  const ref = doc(db, 'portal', uid, 'roster', id);
  try{
    if(!email){
      await deleteDoc(ref); delete roster[id]; rowMsg[id] = { text: '已清除', ok: true };
    }else{
      if(!EMAIL_RE.test(email)){ rowMsg[id] = { text: '電子郵件格式不正確', ok: false }; return render(); }
      const dup = Object.keys(roster).find(k => k !== id && roster[k].email === email);
      if(dup){ rowMsg[id] = { text: `這個電子郵件已經給了 ${students[dup] ? students[dup].name : '另一位學生'}`, ok: false }; return render(); }
      const data = Object.assign({}, roster[id] || {}, { email, name: students[id] ? students[id].name : '', updatedAt: Date.now() });   // 保留彈跳視窗設定和開始上課日
      await setDoc(ref, data); roster[id] = data; rowMsg[id] = { text: '✓ 已儲存', ok: true };
    }
    delete drafts[id];
  }catch(err){
    console.error(err);
    rowMsg[id] = { text: err && err.code === 'permission-denied' ? '沒有權限：Firestore 規則還沒加 portal 那段' : '儲存失敗，請再試一次', ok: false };
  }
  render();
}

// 每位在學的學生各聽一份自己的作業進度
function syncHw(){
  const want = Object.keys(students).filter(id => !students[id].archived);
  Object.keys(hwUnsubs).forEach(id => { if(want.indexOf(id) < 0){ hwUnsubs[id](); delete hwUnsubs[id]; delete hw[id]; } });
  Object.keys(svUnsubs).forEach(id => { if(want.indexOf(id) < 0){ svUnsubs[id](); delete svUnsubs[id]; delete sv[id]; } });
  want.forEach(id => {
    if(!svUnsubs[id]) svUnsubs[id] = onSnapshot(collection(db, 'portal', uid, 'students', id, 'sv'),
      snap => { sv[id] = {}; snap.forEach(d => sv[id][d.id] = d.data()); render(); },
      err => console.error(err));
    if(hwUnsubs[id]) return;
    hwUnsubs[id] = onSnapshot(collection(db, 'portal', uid, 'students', id, 'hw'),
      snap => { hw[id] = {}; snap.forEach(d => hw[id][d.id] = d.data()); render(); },
      err => console.error(err));
  });
}
function stop(){ unsubs.forEach(u => u()); unsubs = []; Object.keys(hwUnsubs).forEach(id => hwUnsubs[id]()); hwUnsubs = {}; hw = {}; Object.keys(svUnsubs).forEach(id => svUnsubs[id]()); svUnsubs = {}; sv = {}; surveys = {}; svRounds = {}; svResps = []; svTr = {}; svTrMsg = ''; svEdit = null; svPub = null; svView = null; svMsg = null; pool = {}; poolLoaded = false; admins = {}; reqs = {}; lists = {}; marks = {}; bbPosts = []; bbWall = []; bbDm = []; placements = []; notes = {}; noteDraft = {}; members = {}; membersLoaded = false; membersErr = false; dmSeen = {}; }
function start(){
  stop(); students = {}; roster = {}; studentsLoaded = rosterLoaded = false; loadErr = '';
  const onErr = err => { console.error(err); loadErr = err && err.code === 'permission-denied' ? '沒有權限讀取：Firestore 規則還沒加 portal 那段（見 README）。' : '讀取失敗，請重新整理。'; render(); };
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'students'), snap => { students = {}; snap.forEach(d => students[d.id] = d.data()); studentsLoaded = true; syncHw(); render(); syncMembers(); }, onErr));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'hwPool'), snap => { pool = {}; snap.forEach(d => pool[d.id] = d.data()); poolLoaded = true; render(); }, err => { console.error(err); poolLoaded = true; render(); }));
  unsubs.push(onSnapshot(doc(db, 'portal', uid, 'config', 'nudge'), s => { nudCfg = s.exists() ? s.data() : null; render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'requests'), snap => { reqs = {}; snap.forEach(d => reqs[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(query(collection(db, 'portal', uid, 'board'), orderBy('ts', 'desc'), limit(50)), snap => { bbPosts = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); renderSoftA(); }, err => console.error(err)));
  unsubs.push(onSnapshot(query(collection(db, 'portal', uid, 'wall'), orderBy('ts', 'desc'), limit(100)), snap => { bbWall = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); renderSoftA(); }, err => console.error(err)));
  unsubs.push(onSnapshot(query(collection(db, 'portal', uid, 'dm'), orderBy('ts', 'desc'), limit(500)), snap => { bbDm = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); renderSoftA(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'members'), snap => { members = {}; snap.forEach(d => members[d.id] = d.data()); membersLoaded = true; syncMembers(); }, err => { console.error(err); membersErr = true; render(); }));
  unsubs.push(onSnapshot(doc(db, 'portal', uid, 'config', 'dmSeen'), s => { dmSeen = s.exists() ? s.data() : {}; renderSoftA(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'surveys'), snap => { surveys = {}; snap.forEach(d => surveys[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'svRounds'), snap => { svRounds = {}; snap.forEach(d => svRounds[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'svResp'), snap => { svResps = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'placements'), snap => { placements = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'notes'), snap => { notes = {}; snap.forEach(d => notes[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(doc(db, 'portal', uid, 'config', 'gmap'), d => { gmap = d.exists() ? (d.data().map || {}) : {}; render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'lists'), snap => { lists = {}; snap.forEach(d => lists[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'marks'), snap => { marks = {}; snap.forEach(d => marks[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'admins'), snap => { admins = {}; snap.forEach(d => admins[d.id] = d.data()); render(); }, err => console.error(err)));
  unsubs.push(onSnapshot(collection(db, 'portal', uid, 'roster'), snap => { roster = {}; snap.forEach(d => roster[d.id] = d.data()); rosterLoaded = true; render(); syncMembers(); }, onErr));
}

try{ ptLoad().then(() => render()); }catch(e){}
$('btnLogout').onclick = () => signOut(auth);
onAuthStateChanged(auth, user => {
  authReady = true; uid = user ? user.uid : null; loginErr = ''; gradeOpen = null; gdraft = null;
  if(uid) start(); else { stop(); render(); }
  if(uid) render();
});
render();
</script>
