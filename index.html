<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi diario de chino · 我的中文日誌</title>
<meta name="description" content="Tu calendario de clases y tu estado de pago · 你的上課行事曆與付費狀況">
<style>
:root{
  --bg:#ece8df; --card:#f8f6f0; --line:#d9d3c5; --text:#3b372f; --sub:#7b7467;
  --accent:#7a6a50; --accent-soft:#e6dfd0; --done:#6f8f72; --off:#b3ab9c; --warn:#a04b3f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.big{font-size:20px;font-weight:600}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{margin-bottom:0}
.grid2{margin-bottom:12px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
button.primary{width:100%;margin-top:14px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-size:16px;cursor:pointer}
button.primary:disabled{opacity:.5}
button.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:transparent;border-radius:8px;font:inherit;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--accent-soft);color:var(--text);border-color:var(--accent)}
.msg{font-size:14px;margin-top:10px}
.msg.err{color:var(--warn)} .msg.ok{color:var(--done)}
.center{text-align:center}
.time{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.time b{font-weight:600}
.tag{font-size:12px;color:var(--sub);margin-left:6px}
/* 月曆 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head button{border:1px solid var(--line);background:transparent;border-radius:8px;width:34px;height:30px;cursor:pointer;color:var(--text);font-size:16px}
.cal-head button:disabled{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.day{aspect-ratio:1/1;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:14px;color:var(--text);cursor:pointer;padding:0;position:relative}
.day.out{color:#c4bdae}
.day.today{font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{box-shadow:0 0 0 2px #3b372f;z-index:1}
.day.today.sel{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px #3b372f}
.day.st-done{background:#dbe7da;color:#35553a;border-color:#b9cdb8}
.day.st-up{background:#f0e2c3;color:#5a4624;border-color:#d2b97f}
.day.st-off{background:#e8e4db;color:#9a9385;text-decoration:line-through;border-color:#d6d0c3}
.day.out.st-done,.day.out.st-up,.day.out.st-off{opacity:.55}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid}
.sw.done{background:#dbe7da;border-color:#b9cdb8}.sw.up{background:#f0e2c3;border-color:#d2b97f}.sw.off{background:#e8e4db;border-color:#d6d0c3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.lesson{border-top:1px solid var(--line);padding:10px 0}
.lesson:first-child{border-top:0;padding-top:2px}
.lesson.off{opacity:.55}
.lesson.off .time b{text-decoration:line-through}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:18px}
.hidden{display:none !important}

/* 作業 */
.lt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lt button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:16px;cursor:pointer}
.lt button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .d{color:var(--sub);font-size:13px;min-width:46px}
.lym{font-size:13px;color:var(--sub);font-weight:600;margin:10px 0 2px}
.lchip{display:inline-block;background:#ece7dc;border-radius:12px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
.lchip small{color:var(--sub)}
.rcard{text-align:center;padding:26px 10px}
.rcard .z{font-size:34px;font-weight:600}
.rcard .e{font-size:18px;color:var(--sub);margin-top:10px;min-height:26px}
.lbar{height:10px;background:#ece7dc;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.lbar i{display:block;height:100%;background:var(--accent)}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.lgrid div{background:#f3efe6;border-radius:8px;padding:8px 4px;text-align:center}
.lgrid b{display:block;font-size:20px}
.lgrid span{font-size:11px;color:var(--sub)}
.hwitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hwitem:first-of-type{border-top:0;padding-top:2px}
.hwitem .t{font-weight:600}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;margin-top:3px}
.chip.todo{background:#e8e4db;color:#7b7467}.chip.submitted{background:#f0e2c3;color:#5a4624}.chip.graded{background:#dbe7da;color:#35553a}
.btn{font:inherit;font-size:14px;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:18px;cursor:pointer}
.btn.quiet{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5}
.hwq{padding:10px 0;border-top:1px solid var(--line)}
.hwq:first-of-type{border-top:0}
.hwq .no{display:inline-block;min-width:22px;color:var(--sub);font-size:13px}
.hwq .zh{font-size:18px;line-height:2}
.hwq .es{font-size:13px;color:var(--sub);margin-top:2px}
.hwq input[type=text],.hwq textarea,.hwq select{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
.hwq input.blank{width:5.5em;text-align:center;margin:0 3px}
.hwq textarea{width:100%;min-height:64px;margin-top:6px;resize:vertical}
.hwq .opt{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:17px}
.hwq input[type=radio]{width:20px;height:20px;flex:none;margin:0;padding:0;accent-color:#7a6a50}
.hwq .opt b{flex:none}
.rv{margin:6px 0 2px;padding:8px 10px;border-radius:8px;font-size:14px;line-height:1.7}
.rv.y{background:#dbe7da}.rv.n{background:#f3dfd9}.rv.h{background:#f0e2c3}
.rv .k{display:block;color:var(--text)}.rv .lab{font-size:12px;color:var(--sub);margin-right:6px}.rv .nt{display:block;font-size:12px;color:var(--sub)}
.mk{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:17px;line-height:1.8;white-space:pre-wrap}
.tnote{background:#f0ece1;border-radius:8px;padding:10px 12px;font-size:15px;margin-top:10px;white-space:pre-wrap}
.rvb{font-size:13px;font-weight:600;margin-right:6px}

.bank{background:#f0ece1;border-radius:8px;padding:8px 12px;margin:6px 0 4px;font-size:17px;line-height:1.9}
.tok{font:inherit;font-size:17px;padding:5px 10px;margin:3px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
.ans{min-height:44px;border-bottom:2px solid var(--accent);padding:4px 0;margin-bottom:6px}
.ans .tok{background:var(--accent-soft)}
.matchrow{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:18px}
.rights{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:15px;margin:6px 0 10px;color:var(--sub)}
.savemsg{font-size:12px;color:var(--sub);min-height:16px;text-align:right}
.savemsg.err{color:var(--warn)}
.slowhint{visibility:hidden;animation:slowshow 0s 10s forwards}
@keyframes slowshow{to{visibility:visible}}
.nud{position:fixed;inset:0;background:rgba(59,55,47,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.nudc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 22px 22px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(59,55,47,.18)}
.nudx{position:absolute;top:6px;right:8px;width:40px;height:40px;border:0;background:none;font-size:28px;line-height:1;color:var(--sub);cursor:pointer}
.nudk{font-size:12px;color:var(--sub);letter-spacing:.06em;margin-bottom:8px}
.nudt{font-size:18px;line-height:1.65;padding-right:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appTitle"></h1>
    <div class="lang" id="langBar">
      <button data-l="es">ES</button><button data-l="tc">繁</button><button data-l="sc">简</button>
    </div>
  </header>
  <main id="app"><div class="card center muted" id="loading"><div class="slowhint"><div class="small" style="margin:10px 0 6px">等很久了嗎？Tarda mucho?</div><button onclick="location.reload()">重新載入 / Recargar</button></div></div></main>
  <div class="foot" id="foot"></div>
</div>
<script src="portal-core.js"></script>
<script src="portal-hw.js"></script>
<script src="portal-nudge.js"></script>
<script src="portal-learn.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, collection, query, where, getDocs, updateDoc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 跟日誌、老師後台用同一個 Firebase 專案 */
const app = initializeApp({
  apiKey: "AIzaSyDB6zYAHvi0oTkObv-qDnP6nn0UUnscby0",
  authDomain: "moneybook-50481.firebaseapp.com",
  projectId: "moneybook-50481",
  storageBucket: "moneybook-50481.firebasestorage.app",
  messagingSenderId: "549256761796",
  appId: "1:549256761796:web:254332f109e7b8ad871491"
});
const auth = getAuth(app), db = getFirestore(app);

const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────── 狀態 ───────── */
let lang = LS.get('dc.lang') || pcDetectLang(navigator.language);
let tid = null;                  // 老師的 uid，從老師給的連結（?t=）取得，之後記在這台裝置
let studentId = null, studentDoc = null, docLoaded = false, docError = null;
let unsubDoc = null;
let authMode = 'login';          // 'login' | 'register'
let calMonth = null, selDay = null;   // calMonth: {y, m}
let tzSetting = null;            // 學生自己選的時區（沒選就 null）
let busyMsg = '', busyErr = '';
const T = (k, p) => pcT(lang, k, p);
const pageT0 = Date.now();
function loadingHtml(){
  const el = Math.min(((Date.now() - pageT0) / 1000), 60).toFixed(1);
  return `<div class="card center muted">${esc(T('loading'))}<div class="slowhint" style="animation-delay:-${el}s"><div class="small" style="margin:10px 0 6px">${esc(T('slow'))}</div><button onclick="location.reload()">${esc(T('reload'))}</button></div></div>`;
}

// 老師預覽：?preview=學生代號。用老師後台登入的帳號，唯讀看那位學生登入後會看到的畫面
const PREVIEW = (function(){ const v = new URLSearchParams(location.search).get('preview'); return v && v.indexOf('/') < 0 && v.length < 200 ? v : null; })();

(function readTeacherId(){
  const q = new URLSearchParams(location.search).get('t');
  if(q && /^[A-Za-z0-9]{20,40}$/.test(q)){ LS.set('dc.t', q); tid = q; history.replaceState(null, '', location.pathname); }
  else tid = LS.get('dc.t');
})();

function effectiveTz(){
  if(tzSetting) return tzSetting;
  if(studentDoc && studentDoc.tz) return studentDoc.tz;
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei'; }catch(e){ return 'Asia/Taipei'; }
}
function tzSource(){
  if(tzSetting) return 'custom';
  if(studentDoc && studentDoc.tz) return 'teacher';
  return 'device';
}
function allTimeZones(){
  try{ if(Intl.supportedValuesOf) return Intl.supportedValuesOf('timeZone'); }catch(e){}
  return ['America/Mexico_City','America/Bogota','America/Lima','America/Santiago','America/Argentina/Buenos_Aires','America/Sao_Paulo','America/Caracas','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Europe/Madrid','Asia/Taipei','Asia/Manila'];
}

/* ───────── 畫面 ───────── */
function setLang(l){
  lang = l; LS.set('dc.lang', l);
  document.documentElement.lang = l === 'es' ? 'es' : l === 'sc' ? 'zh-CN' : 'zh-TW';
  document.querySelectorAll('#langBar button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  $('appTitle').textContent = T('title');
  render();
}
document.querySelectorAll('#langBar button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));

function renderPreview(root, user){
  if(!authReady){ root.innerHTML = loadingHtml(); return; }
  if(!user){ root.innerHTML = `<div class="card center">老師預覽要先登入老師後台。<br><a href="admin.html">前往老師後台登入</a>，登入後再按學生旁邊的「預覽」。</div>`; return; }
  if(!docLoaded){ root.innerHTML = loadingHtml(); return; }
  if(docError) return renderError(root);
  renderHome(root);
  root.insertAdjacentHTML('afterbegin', `<div class="card center" style="background:#e6dfd0">老師預覽：${esc(studentDoc && studentDoc.name || PREVIEW)}（唯讀，學生看到的就是這個畫面）　<a href="admin.html">回後台</a></div>`);
}

function render(){
  const root = $('app');
  const user = auth.currentUser;
  $('foot').textContent = '';
  if(PREVIEW) return renderPreview(root, user);
  if(!tid && !user){ root.innerHTML = `<div class="card center">${esc(T('needLink'))}</div>`; return; }
  if(!authReady){ root.innerHTML = loadingHtml(); return; }
  if(!user) return renderAuth(root);
  if(!tid){ root.innerHTML = `<div class="card center">${esc(T('needLink'))}</div>${logoutBlock()}`; bindLogout(); return; }
  if(!user.emailVerified) return renderVerify(root, user);
  if(rosterState === 'loading') { root.innerHTML = loadingHtml(); return; }
  if(rosterState === 'none') return renderNotListed(root, user);
  if(rosterState === 'error') return renderError(root);
  renderHome(root);
}

function logoutBlock(){ if(PREVIEW) return ''; return `<div class="center"><button class="link" id="btnLogout">${esc(T('logout'))}</button></div>`; }
function bindLogout(){ const b = $('btnLogout'); if(b) b.onclick = () => signOut(auth); }

function renderAuth(root){
  root.innerHTML = `
    <div class="card">
      <div class="tabs"><button data-m="login" class="${authMode === 'login' ? 'on' : ''}">${esc(T('login'))}</button><button data-m="register" class="${authMode === 'register' ? 'on' : ''}">${esc(T('register'))}</button></div>
      <form id="authForm" novalidate>
        <label for="em">${esc(T('email'))}</label><input id="em" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required>
        <label for="pw">${esc(T('password'))}</label><input id="pw" type="password" autocomplete="${authMode === 'login' ? 'current-password' : 'new-password'}" required>
        <button class="primary" id="btnAuth" type="submit">${esc(authMode === 'login' ? T('login') : T('register'))}</button>
      </form>
      <div class="msg ${busyErr ? 'err' : 'ok'}" id="authMsg">${esc(busyErr || busyMsg)}</div>
      ${authMode === 'login' ? `<div class="center"><button class="link" id="btnForgot">${esc(T('forgot'))}</button></div>` : ''}
    </div>`;
  root.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { authMode = b.dataset.m; busyErr = busyMsg = ''; render(); });
  $('authForm').onsubmit = async e => {
    e.preventDefault();
    const em = $('em').value.trim().toLowerCase(), pw = $('pw').value;
    busyErr = busyMsg = ''; $('btnAuth').disabled = true;
    try{
      auth.languageCode = lang === 'es' ? 'es' : lang === 'sc' ? 'zh-CN' : 'zh-TW';
      if(authMode === 'register'){
        const cred = await createUserWithEmailAndPassword(auth, em, pw);
        await sendEmailVerification(cred.user);
      }else{
        await signInWithEmailAndPassword(auth, em, pw);
      }
    }catch(err){ busyErr = T(pcAuthErrorKey(err && err.code)); render(); }
  };
  const f = $('btnForgot');
  if(f) f.onclick = async () => {
    const em = $('em').value.trim().toLowerCase();
    if(!em){ $('authMsg').className = 'msg err'; $('authMsg').textContent = T('errEmail'); return; }
    try{ auth.languageCode = lang === 'es' ? 'es' : lang === 'sc' ? 'zh-CN' : 'zh-TW'; await sendPasswordResetEmail(auth, em); $('authMsg').className = 'msg ok'; $('authMsg').textContent = T('resetSent'); }
    catch(err){ $('authMsg').className = 'msg err'; $('authMsg').textContent = T(pcAuthErrorKey(err && err.code)); }
  };
}

function renderVerify(root, user){
  root.innerHTML = `
    <div class="card">
      <h2>${esc(T('verifyTitle'))}</h2>
      <div>${esc(T('verifyMsg', { email: user.email }))}</div>
      <button class="primary" id="btnDone">${esc(T('verifyDone'))}</button>
      <div class="center"><button class="link" id="btnResend">${esc(T('verifyResend'))}</button></div>
      <div class="msg ${busyErr ? 'err' : 'ok'} center" id="vMsg">${esc(busyErr || busyMsg)}</div>
    </div>${logoutBlock()}`;
  bindLogout();
  $('btnDone').onclick = async () => {
    try{ await user.reload(); }catch(e){}
    if(auth.currentUser && auth.currentUser.emailVerified){ await auth.currentUser.getIdToken(true); startRoster(); } else render();
  };
  $('btnResend').onclick = async () => {
    try{ auth.languageCode = lang === 'es' ? 'es' : lang === 'sc' ? 'zh-CN' : 'zh-TW'; await sendEmailVerification(user); busyErr = ''; busyMsg = T('sent'); }
    catch(err){ busyMsg = ''; busyErr = T(pcAuthErrorKey(err && err.code)); }
    render();
  };
}

/* 還沒登記的學生：驗證過信箱後，留一筆「新註冊」給老師，老師在後台選是哪位學生就會通過 */
let reqTried = false, reqOk = false;
function renderNotListed(root, user){
  root.innerHTML = `<div class="card"><h2>${esc(T('notListedTitle'))}</h2><div>${esc(T(reqOk ? 'notListedSent' : 'notListedMsg', { email: user.email }))}</div>${reqOk ? `<button class="primary" id="btnRecheck">${esc(T('recheck'))}</button>` : ''}</div>${logoutBlock()}`;
  bindLogout();
  if(reqOk) $('btnRecheck').onclick = () => startRoster();
  if(!reqTried && !PREVIEW){
    reqTried = true;
    setDoc(doc(db, 'portal', tid, 'requests', user.uid), { email: String(user.email).toLowerCase(), uid: user.uid, at: Date.now() })
      .then(() => { reqOk = true; render(); }).catch(err => console.error(err));
  }
}
function renderError(root){
  root.innerHTML = `<div class="card center"><div class="msg err">${esc(docError || T('errOther'))}</div><button class="link" id="btnRetry">${esc(T('retry'))}</button></div>${logoutBlock()}`;
  bindLogout(); $('btnRetry').onclick = () => { if(PREVIEW){ if(unsubDoc){ unsubDoc(); unsubDoc = null; } startPreview(auth.currentUser); } else startRoster(); };
}

function fmtMs(ms){
  return new Intl.DateTimeFormat(lang === 'es' ? 'es' : lang === 'sc' ? 'zh-CN' : 'zh-TW', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ms));
}

function timesHtml(v, tz){
  if(v.allDay) return `<div class="time"><span>${esc(T('off'))}</span></div>`;
  const shift = v.dayShift === 0 ? '' : `<span class="tag">${esc(v.dayShift < 0 ? T('prevDay') : T('nextDay'))}</span>`;
  return `<div class="time"><span>${esc(T('twTime'))}</span><b>${esc(v.twStart)}–${esc(v.twEnd)}</b></div>
          <div class="time"><span>${esc(T('yourTime'))}${shift}</span><b>${esc(v.localStart)}–${esc(v.localEnd)}</b></div>`;
}

function renderHome(root){
  if(!docLoaded){ root.innerHTML = loadingHtml(); return; }
  if(docError){ return renderError(root); }
  if(!studentDoc){ root.innerHTML = `<div class="card center">${esc(T('noNoData'))}</div>${logoutBlock()}`; bindLogout(); return; }
  if(studentDoc.archived){ root.innerHTML = `<div class="card center">${esc(T('archived'))}</div>${logoutBlock()}`; bindLogout(); return; }

  if(hwOpen && hwDocs[hwOpen]) return renderHw(root);
  if(learnOpen) return renderLearn(root);
  const tz = effectiveTz(), now = Date.now();
  const groups = pcGroupByLocalDate(studentDoc.lessons || [], tz);
  const next = pcNextLesson(studentDoc.lessons || [], tz, now);
  const todayLocal = pcLocalParts(now, tz).date;
  if(!calMonth) calMonth = { y: +todayLocal.slice(0, 4), m: +todayLocal.slice(5, 7) };
  if(!selDay) selDay = todayLocal;

  /* 下一堂課 */
  let nextHtml;
  if(next){
    const dd = pcDaysBetween(todayLocal, next.localDate);
    const rel = next.startMs <= now ? T('now') : dd <= 0 ? T('today') : dd === 1 ? T('tomorrow') : T('inDays', { n: dd });
    nextHtml = `<div class="row"><span class="big">${esc(pcFmtDate(next.localDate, lang, { weekday: 'long', day: 'numeric', month: 'long' }))}</span><span class="muted">${esc(rel)}</span></div>${timesHtml(next, tz)}`;
  }else nextHtml = `<div class="muted">${esc(T('noNext'))}</div>`;

  /* 付費＋已上堂數 */
  const pay = pcPayLine(studentDoc, lang);
  const taught = `<div class="card"><h2>${esc(T('taught'))}</h2><div class="big">${esc(T('unit', { n: studentDoc.taught || 0 }))}</div></div>`;
  const payCard = pay ? `<div class="card"><h2>${esc(pay.label)}</h2><div class="big">${esc(pay.value)}</div></div>` : '';
  const stats = pay ? `<div class="two grid2">${payCard}${taught}</div>` : taught;

  /* 月曆 */
  const cells = pcMonthGrid(calMonth.y, calMonth.m);
  const monthTitle = pcFmtDate(`${calMonth.y}-${String(calMonth.m).padStart(2, '0')}-01`, lang, { year: 'numeric', month: 'long' });
  const dow = [1, 2, 3, 4, 5, 6, 0].map(i => pcFmtDate(pcIsoAdd('2026-11-01', i), lang, { weekday: 'narrow' }));   // 2026-11-01 是週日
  let grid = dow.map(d => `<div class="dow">${esc(d)}</div>`).join('');
  cells.forEach(c => {
    const list = groups[c.date] || [];
    const sts = list.map(v => pcStatus(v, now));
    // 同一天有好幾堂時：還有沒上的課 > 已上 > 請假／沒上課
    const st = sts.some(x => x === 'upcoming' || x === 'now') ? 'st-up' : sts.includes('done') ? 'st-done' : sts.length ? 'st-off' : '';
    grid += `<button class="day ${c.inMonth ? '' : 'out'} ${st} ${c.date === todayLocal ? 'today' : ''} ${c.date === selDay ? 'sel' : ''}" data-d="${c.date}"><span>${+c.date.slice(8)}</span></button>`;
  });
  const dayList = groups[selDay] || [];
  const detail = dayList.length
    ? dayList.map(v => `<div class="lesson ${pcStatus(v, now) === 'off' ? 'off' : ''}">${timesHtml(v, tz)}</div>`).join('')
    : `<div class="muted">${esc(T('noClassDay'))}</div>`;

  /* 時區 */
  const zones = allTimeZones();
  const opts = zones.map(z => `<option value="${esc(z)}" ${z === tz ? 'selected' : ''}>${esc(z)}</option>`).join('');
  const srcLabel = tzSource() === 'teacher' ? T('tzTeacher') : tzSource() === 'device' ? T('tzDevice') : '';

  root.innerHTML = `
    <div class="card"><div class="muted">${esc(T('hello', { name: studentDoc.name || '' }))}</div></div>
    <div class="card"><h2>${esc(T('nextClass'))}</h2>${nextHtml}</div>
    ${hwCardHtml()}
    ${learnCardHtml()}
    ${stats}
    <div class="card">
      <h2>${esc(T('calendar'))}</h2>
      <div class="cal-head"><button id="calPrev" aria-label="prev">‹</button><b>${esc(monthTitle)}</b><button id="calNext" aria-label="next">›</button></div>
      <div class="cal-grid">${grid}</div>
      <div class="legend"><span><i class="sw done"></i>${esc(T('legendDone'))}</span><span><i class="sw up"></i>${esc(T('legendNext'))}</span><span><i class="sw off"></i>${esc(T('legendOff'))}</span></div>
    </div>
    <div class="card"><h2>${esc(T('dayDetail'))} · ${esc(pcFmtDate(selDay, lang, { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>${detail}</div>
    <div class="card">
      <h2>${esc(T('timezone'))}</h2>
      <select id="tzSel">${opts}</select>
      <div class="muted" style="margin-top:6px">${esc(srcLabel)}</div>
    </div>
    ${logoutBlock()}`;
  $('foot').textContent = studentDoc.updatedAt ? T('updated', { t: fmtMs(studentDoc.updatedAt) }) : '';

  root.querySelectorAll('.day').forEach(b => b.onclick = () => { selDay = b.dataset.d; calMonth = { y: +selDay.slice(0, 4), m: +selDay.slice(5, 7) }; render(); });
  $('calPrev').onclick = () => { calMonth = calMonth.m === 1 ? { y: calMonth.y - 1, m: 12 } : { y: calMonth.y, m: calMonth.m - 1 }; render(); };
  $('calNext').onclick = () => { calMonth = calMonth.m === 12 ? { y: calMonth.y + 1, m: 1 } : { y: calMonth.y, m: calMonth.m + 1 }; render(); };
  $('tzSel').onchange = e => { tzSetting = e.target.value; if(!PREVIEW) LS.set('dc.tz.' + tid, tzSetting); selDay = null; render(); };
  bindLogout(); bindHwCard(root); bindLearnCard(root); nudMaybeStart();
}

/* ───────── 學習分頁：上課紀錄、已學清單、複習、能力、教材 ───────── */
let learnOpen = false, learnTab = 'log', revShown = false, revOnlyNot = false, revSeed = 1, revIdx = 0, revRound = null, matDoc = null, matLoaded = false, matTried = false;
const LT = (k, p) => learnT(lang, k, p);
const revDeck = pool => { if(!revRound) revRound = learnDeck(pool.words, revMarks(), revOnlyNot, revSeed).map(w => w.zh); return revRound.map(zh => pool.words.find(w => w.zh === zh)).filter(Boolean); };   // 一輪開始時固定牌組，標「我記得」才不會讓下一張被跳過
const revMarks = () => { try{ return JSON.parse(LS.get('dc.rev.' + studentId) || '{}') || {}; }catch(e){ return {}; } };
const revMark = (zh, v) => { if(PREVIEW) return; const m = revMarks(); if(v) m[zh] = 1; else delete m[zh]; LS.set('dc.rev.' + studentId, JSON.stringify(m)); };
async function loadMaterials(){
  if(matTried) return; matTried = true;
  try{ const s = await getDoc(doc(db, 'portal', tid, 'materials', studentId)); matDoc = s.exists() ? s.data() : null; }catch(e){ matDoc = null; }
  matLoaded = true; if(learnOpen) render();
}
function learnCardHtml(){
  return `<div class="card"><div class="row"><h2 style="margin:0">${esc(LT('learn'))}</h2><button class="btn" id="learnGo">${esc(LT('learnBtn'))}</button></div></div>`;
}
function bindLearnCard(root){ const b = root.querySelector('#learnGo'); if(b) b.onclick = () => { learnOpen = true; learnTab = 'log'; revShown = false; revIdx = 0; revRound = null; revSeed = Date.now() % 100000; loadMaterials(); render(); window.scrollTo(0, 0); }; }
function renderLearn(root){
  const pool = nudBuildPool(hwDocs);
  const tabs = ['log', 'words', 'review', 'ability', 'files'], names = { log: 'tLog', words: 'tWords', review: 'tReview', ability: 'tAbility', files: 'tFiles' };
  let body = '';
  if(learnTab === 'log'){
    const groups = learnLogGroups(studentDoc.log), n = groups.reduce((a, g) => a + g.rows.length, 0);
    const nx = studentDoc.next && studentDoc.next.n ? `<div class="card"><h2>${esc(LT('nextUp'))}</h2><div>${esc(studentDoc.next.n)}</div></div>` : '';
    body = nx + (n ? `<div class="card"><h2>${esc(LT('logCount', { n }))}</h2>` + groups.map(g => `<div class="lym">${esc(pcFmtDate(g.ym + '-01', lang, { year: 'numeric', month: 'long' }))}</div>` +
      g.rows.map(r => `<div class="lrow"><span class="d">${esc(pcFmtDate(r.d, lang, { month: 'numeric', day: 'numeric' }))}</span><span>${esc(r.p)}</span></div>`).join('')).join('') + '</div>'
      : `<div class="card center muted">${esc(LT('logEmpty'))}</div>`);
  }else if(learnTab === 'words'){
    if(!pool.words.length && !pool.points.length) body = `<div class="card center muted">${esc(LT('wordsEmpty'))}</div>`;
    else body = (pool.points.length ? `<div class="card"><h2>${esc(LT('pointsHead', { n: pool.points.length }))}</h2>${pool.points.map(x => `<span class="lchip">${esc(x)}</span>`).join('')}</div>` : '') +
      (pool.words.length ? `<div class="card"><h2>${esc(LT('wordsHead', { n: pool.words.length }))}</h2>${pool.words.map(w => `<span class="lchip">${esc(w.zh)}${w.es ? ` <small>${esc(w.es)}</small>` : ''}</span>`).join('')}</div>` : '');
  }else if(learnTab === 'review'){
    const deck = revDeck(pool);
    const tog = `<div class="lt"><button id="revAll" class="${revOnlyNot ? '' : 'on'}">${esc(LT('revAll'))}</button><button id="revNot" class="${revOnlyNot ? 'on' : ''}">${esc(LT('revOnlyNot'))}</button></div>`;
    if(!pool.words.length) body = `<div class="card center muted">${esc(LT('revEmpty'))}</div>`;
    else if(!deck.length) body = tog + `<div class="card center muted">${esc(LT('revNoNot'))}</div>`;
    else if(revIdx >= deck.length) body = tog + `<div class="card center"><div class="big">${esc(LT('revDone'))}</div><div style="margin-top:12px"><button class="btn" id="revAgain">${esc(LT('revAgain'))}</button></div></div>`;
    else{
      const w = deck[revIdx];
      body = tog + `<div class="card rcard"><div class="muted">${esc(LT('revLeft', { n: deck.length - revIdx }))}</div><div class="z">${esc(w.zh)}</div><div class="e">${revShown ? esc(w.es || '—') : ''}</div>
        <div style="margin-top:14px">${revShown ? `<button class="btn" id="revKnow">${esc(LT('revKnow'))}</button> <button class="btn quiet" id="revNotYet">${esc(LT('revNot'))}</button>` : `<button class="btn" id="revShow">${esc(LT('revShow'))}</button>`}</div></div>`;
    }
  }else if(learnTab === 'ability'){
    const ab = learnAbility(hwDocs), types = Object.keys(ab.byType);
    body = `<div class="lgrid"><div><b>${ab.graded}</b><span>${esc(LT('abHw'))}</span></div><div><b>${pool.words.length}</b><span>${esc(LT('abWords'))}</span></div><div><b>${pool.points.length}</b><span>${esc(LT('abPoints'))}</span></div><div><b>${studentDoc.taught || 0}</b><span>${esc(LT('abClasses'))}</span></div></div>`;
    if(!ab.graded) body += `<div class="card center muted">${esc(LT('abEmpty'))}</div>`;
    else{
      if(types.length) body += `<div class="card"><h2>${esc(LT('abByType'))}</h2>${types.map(k => `<div class="row"><span>${esc(learnTypeName(lang, k))}</span><b>${ab.byType[k].pct}%</b></div><div class="lbar"><i style="width:${ab.byType[k].pct}%"></i></div>`).join('')}</div>`;
      if(ab.trend.length) body += `<div class="card"><h2>${esc(LT('abTrend'))}</h2>${ab.trend.map(t => `<div class="row"><span>${esc(t.title)}</span><b>${t.pct}%</b></div><div class="lbar"><i style="width:${t.pct}%"></i></div>`).join('')}<div class="muted">${esc(LT('abNote'))}</div></div>`;
    }
  }else{
    const files = learnFiles(matDoc);
    body = !matLoaded ? `<div class="card center muted">${esc(T('loading'))}</div>` : files.length
      ? `<div class="card">${files.map(f => `<div class="hwitem"><div><div class="t">${esc(f.n)}</div>${f.t ? `<div class="muted">${esc(fmtMs(f.t))}</div>` : ''}</div><a class="btn quiet" style="text-decoration:none" href="${esc(f.u)}" target="_blank" rel="noopener noreferrer">${esc(LT('fOpen'))}</a></div>`).join('')}</div>`
      : `<div class="card center muted">${esc(LT('fEmpty'))}</div>`;
  }
  root.innerHTML = `<div class="card"><button class="btn quiet" id="learnBack">${esc(LT('learnBack'))}</button> <b style="margin-left:6px">${esc(LT('learn'))}</b></div>
    <div class="lt">${tabs.map(k => `<button data-lt="${k}" class="${k === learnTab ? 'on' : ''}">${esc(LT(names[k]))}</button>`).join('')}</div>${body}${logoutBlock()}`;
  $('foot').textContent = studentDoc.updatedAt ? T('updated', { t: fmtMs(studentDoc.updatedAt) }) : '';
  $('learnBack').onclick = () => { learnOpen = false; render(); window.scrollTo(0, 0); };
  root.querySelectorAll('[data-lt]').forEach(b => b.onclick = () => { learnTab = b.dataset.lt; revShown = false; revIdx = 0; revRound = null; render(); });
  const on = (id, f) => { const e = root.querySelector('#' + id); if(e) e.onclick = f; };
  on('revAll', () => { revOnlyNot = false; revRound = null; revIdx = 0; revShown = false; render(); });
  on('revNot', () => { revOnlyNot = true; revRound = null; revIdx = 0; revShown = false; render(); });
  on('revAgain', () => { revIdx = 0; revShown = false; revSeed++; revRound = null; render(); });
  on('revShow', () => { revShown = true; render(); });
  const cur = () => revDeck(pool)[revIdx];
  on('revKnow', () => { const w = cur(); if(w) revMark(w.zh, false); revIdx++; revShown = false; render(); });
  on('revNotYet', () => { const w = cur(); if(w) revMark(w.zh, true); revIdx++; revShown = false; render(); });
  bindLogout();
}

/* ───────── 彈跳視窗：練習題、激勵句、提醒（只有右上角 X 可以關） ───────── */
let rosterData = null, rosterReady = false, nudCfg = null, nudCfgTried = false, nudEntered = false, nudTimer = null, nudBox = null;
const nudOn = () => !!(studentDoc && !studentDoc.archived && !(rosterData && rosterData.nudge && rosterData.nudge.on === false));
const nudSeen = () => { try{ return JSON.parse(LS.get('dc.seen.' + studentId) || '{}') || {}; }catch(e){ return {}; } };
const nudMarkSeen = id => { if(PREVIEW) return; const s = nudSeen(); s[id] = 1; LS.set('dc.seen.' + studentId, JSON.stringify(s)); };
async function nudLoadCfg(){
  if(nudCfgTried) return; nudCfgTried = true;
  try{ const s = await getDoc(doc(db, 'portal', tid, 'config', 'nudge')); nudCfg = s.exists() ? s.data() : null; }catch(e){ nudCfg = null; }
}
function nudClose(){ if(nudBox){ nudBox.remove(); nudBox = null; } }
function nudShow(item){
  nudClose();
  const box = document.createElement('div');
  box.className = 'nud'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-live', 'polite');
  const label = item.kind === 'enc' ? 'nudEnc' : item.kind === 'rem' ? 'nudRem' : 'nudQ';
  box.innerHTML = `<div class="nudc"><button class="nudx" id="nudX" aria-label="${esc(T('nudClose'))}">×</button><div class="nudk">${esc(T(label))}</div><div class="nudt" id="nudText">${esc(item.text)}</div></div>`;
  document.body.appendChild(box); nudBox = box;
  $('nudX').onclick = nudClose;
}
function nudReminderCtx(){
  const tz = effectiveTz(), now = Date.now(), todayLocal = pcLocalParts(now, tz).date;
  const nx = pcNextLesson(studentDoc.lessons || [], tz, now);
  return { lang, hwDocs, seenGraded: nudSeen(), pay: studentDoc.pay || '', remaining: studentDoc.remaining, now,
    payOn: !(rosterData && rosterData.nudge && rosterData.nudge.pay === false),
    next: nx ? { dd: pcDaysBetween(todayLocal, nx.localDate), localStart: nx.localStart } : null };
}
async function nudMaybeStart(){
  if(nudEntered || !rosterReady || !docLoaded || !hwLoaded || !studentDoc || hwOpen || !nudOn()) return;
  nudEntered = true;
  await nudLoadCfg();
  const todayLocal = pcLocalParts(Date.now(), effectiveTz()).date;
  const vars = { n: studentDoc.taught || 0, t: nudSpan(studentDoc.since, todayLocal, lang) };
  const item = nudOnEnter({ cfg: nudCfg, lang, pool: nudBuildPool(hwDocs), vars, reminders: nudReminders(nudCfg, nudReminderCtx()) }, Math.random);
  if(item && !hwOpen) nudShow(item);
  nudTimer = setInterval(nudTick, window.__nudEvery || 5 * 60 * 1000);
}
function nudTick(){
  if(document.hidden || nudBox || hwOpen || !nudOn() || !auth.currentUser) return;
  const q = nudMakeQuestion(nudBuildPool(hwDocs), lang, Math.random);
  if(q) nudShow(q);
}
function nudStop(){ clearInterval(nudTimer); nudTimer = null; nudClose(); nudEntered = false; rosterReady = false; rosterData = null; nudCfgTried = false; nudCfg = null; }

/* ───────── 作業 ───────── */
let hwDocs = {}, hwLoaded = false, hwErr = false, unsubHw = null;
let hwFile = null, hwFileMsg = '', hwFileBusy = false;
let hwOpen = null, hwOpenStatus = null, hwDraft = {}, hwOrder = {}, hwTimer = null, hwSaveState = '', hwConfirming = false;

function startHw(sid){
  if(unsubHw){ unsubHw(); unsubHw = null; }
  hwDocs = {}; hwLoaded = false; hwErr = false; hwOpen = null;
  unsubHw = onSnapshot(collection(db, 'portal', tid, 'students', sid, 'hw'),
    snap => {
      hwDocs = {}; snap.forEach(d => hwDocs[d.id] = d.data()); hwLoaded = true; hwErr = false;
      if(hwOpen && !hwDocs[hwOpen]) hwOpen = null;
      // 正在作答時，自己存檔造成的更新不重畫（不然輸入框會被洗掉）；只有狀態變了（交出、被批改、被退回）才重畫
      if(hwOpen && hwDocs[hwOpen].status === hwOpenStatus) return;
      render();
    },
    err => { console.error(err); hwLoaded = true; hwErr = true; render(); });
}
function stopHw(){ if(unsubHw){ unsubHw(); unsubHw = null; } hwDocs = {}; hwLoaded = false; hwErr = false; hwOpen = null; clearTimeout(hwTimer); }

const hwLetter = i => String.fromCharCode(65 + i);
const hwChip = d => `<span class="chip ${esc(d.status)}">${esc(T(d.status === 'graded' ? 'hwStGraded' : d.status === 'submitted' ? 'hwStSubmitted' : 'hwStTodo'))}</span>`;

function hwCardHtml(){
  const ids = Object.keys(hwDocs).sort((a, b) => (hwDocs[b].assignedAt || 0) - (hwDocs[a].assignedAt || 0));
  if(!ids.length) return '';
  return `<div class="card"><h2>${esc(T('hwTitle'))}</h2>` + ids.map(id => {
    const d = hwDocs[id];
    return `<div class="hwitem"><div><div class="t">${esc(d.title || '—')}</div>${hwChip(d)}${d.status === 'graded' && d.result && !hwHideScore(d) ? ` <span class="muted">${esc(T('hwScore', { got: d.result.got, max: d.result.max }))}</span>` : ''}</div>
      <button class="btn ${d.status === 'todo' && !PREVIEW ? '' : 'quiet'}" data-hw="${esc(id)}">${esc(T(d.status === 'todo' && !PREVIEW ? 'hwStart' : 'hwView'))}</button></div>`;
  }).join('') + '</div>';
}
function bindHwCard(root){
  root.querySelectorAll('[data-hw]').forEach(b => b.onclick = () => openHw(b.dataset.hw));
}
function openHw(id){
  const d = hwDocs[id]; if(!d) return;
  if(d.status === 'graded') nudMarkSeen(id);
  hwOpen = id; hwOpenStatus = d.status; hwConfirming = false; hwSaveState = '';
  hwDraft = JSON.parse(JSON.stringify(d.answers || {})); hwOrder = {};
  // 排序題：把存好的詞語答案還原成「第幾個詞」
  (d.sections || []).forEach(sec => { if(sec.type === 'order') sec.items.forEach(q => {
    const used = [], a = Array.isArray(hwDraft[q.id]) ? hwDraft[q.id] : [];
    a.forEach(t => { const i = q.tokens.findIndex((x, k) => x === t && used.indexOf(k) < 0); if(i >= 0) used.push(i); });
    hwOrder[q.id] = used;
  }); });
  hwFile = null; hwFileMsg = ''; hwFileBusy = false; hwLoadFile(id);
  render(); window.scrollTo(0, 0);
}
async function hwLoadFile(id){
  if(PREVIEW) return;
  try{
    const s = await getDoc(doc(db, 'portal', tid, 'students', studentId, 'hwFiles', id));
    if(hwOpen !== id) return;
    hwFile = s.exists() ? { name: s.data().name, size: s.data().size, at: s.data().at } : null;
  }catch(err){ hwFile = null; }
  hwWordDraw();
}
function hwSetDraft(id, val){
  if(val === '' || val == null || (Array.isArray(val) && !val.some(x => x))) delete hwDraft[id]; else hwDraft[id] = val;
  if(PREVIEW) return;
  hwSaveState = 'saving'; hwShowSave();
  clearTimeout(hwTimer); hwTimer = setTimeout(hwSave, 1200);
}
function hwShowSave(){
  const el = $('hwSave'); if(!el) return;
  el.textContent = hwSaveState === 'saving' ? T('hwSaving') : hwSaveState === 'saved' ? T('hwSaved') : hwSaveState === 'err' ? T('hwSaveErr') : '';
  el.className = 'savemsg' + (hwSaveState === 'err' ? ' err' : '');
}
async function hwSave(extra){
  const id = hwOpen; if(!id || PREVIEW) return;
  try{
    await updateDoc(doc(db, 'portal', tid, 'students', studentId, 'hw', id), Object.assign({ answers: JSON.parse(JSON.stringify(hwDraft)) }, extra || {}));
    hwSaveState = 'saved'; hwShowSave(); return true;
  }catch(err){ console.error(err); hwSaveState = 'err'; hwShowSave(); return false; }
}
function hwUnansweredCount(d){
  let n = 0;
  (d.sections || []).forEach(sec => sec.items.forEach(q => {
    const a = hwDraft[q.id];
    if(sec.type === 'cloze'){ for(let k = 0; k < q.n; k++) if(!(Array.isArray(a) && a[k])) n++; }
    else if(sec.type === 'order'){ if(!(Array.isArray(a) && a.length)) n++; }
    else if(typeof a === 'undefined' || a === '') n++;
  }));
  return n;
}

const hwHideScore = d => !!(d && d.review && d.review.hideScore);
/* 批改後：老師標記的作答、每題的對錯和標準答案 */
function hwTa(q, a, D){
  const d = hwDocs[hwOpen], rv = d && d.status === 'graded' && d.review && d.review.items && d.review.items[q.id];
  if(rv && typeof rv.mark === 'string' && rv.mark) return `<div class="lab-mk"><span class="muted" style="font-size:12px">${esc(T('hwMarked'))}</span></div><div class="mk">${hwCleanMark(rv.mark)}</div>`;
  return `<textarea data-k="txt" data-id="${esc(q.id)}" placeholder="${esc(T('hwWrite'))}"${D}>${esc(a || '')}</textarea>`;
}
function hwReviewHtml(sec, q){
  const d = hwDocs[hwOpen], rv = d && d.status === 'graded' && d.review && d.review.items && d.review.items[q.id];
  if(!rv) return '';
  const cls = rv.got >= rv.max ? 'y' : rv.got > 0 ? 'h' : 'n';
  const ico = cls === 'y' ? '✓' : cls === 'h' ? '½' : '✗';
  const word = T(cls === 'y' ? 'hwRight' : cls === 'h' ? 'hwHalf' : 'hwWrong');
  const pts = !hwHideScore(d) && (sec.type === 'cloze' || cls === 'h') ? ` (${rv.got}/${rv.max})` : '';
  const keyLab = sec.type === 'sentence' ? 'hwSample' : 'hwKey';
  return `<div class="rv ${cls}"><span class="rvb">${ico} ${esc(word)}${esc(pts)}</span>${cls === 'y' && ['translate','zh2es','sentence'].indexOf(sec.type) < 0 ? '' : `<span class="k"><span class="lab">${esc(T(keyLab))}</span>${esc(rv.key || '')}</span>`}${rv.note ? `<span class="nt">${esc(rv.note)}</span>` : ''}</div>`;
}

function hwItemHtml(sec, q, no, dis){
  const a = hwDraft[q.id], D = dis ? ' disabled' : '';
  const head = `<span class="no">${no}</span>`;
  const es = q.es ? `<div class="es">${esc(q.es)}</div>` : '';
  switch(sec.type){
    case 'fill': {
      const i = q.zh.indexOf('__');
      const inp = `<input type="text" class="blank" data-k="txt" data-id="${esc(q.id)}" value="${esc(a || '')}" autocomplete="off" autocapitalize="off"${D}>`;
      return `<div class="hwq">${head}<span class="zh">${i < 0 ? esc(q.zh) + inp : esc(q.zh.slice(0, i)) + inp + esc(q.zh.slice(i + 2))}</span>${es}</div>`;
    }
    case 'cloze': {
      const arr = Array.isArray(a) ? a : [];
      const html = esc(q.text).replace(/\{(\d+)\}/g, (m, n) => `<input type="text" class="blank" data-k="cz" data-id="${esc(q.id)}" data-n="${n - 1}" placeholder="${n}" value="${esc(arr[n - 1] || '')}" autocomplete="off" autocapitalize="off"${D}>`);
      return `<div class="hwq"><div class="zh">${html}</div></div>`;
    }
    case 'order': return `<div class="hwq" data-order="${esc(q.id)}">${head}${hwOrderInner(q, dis)}${es}</div>`;
    case 'choice':
      return `<div class="hwq">${head}${q.es ? `<span class="es" style="display:inline">${esc(q.es)}</span>` : ''}${q.options.map(o =>
        `<label class="opt"><input type="radio" name="r_${esc(q.id)}" data-k="ch" data-id="${esc(q.id)}" value="${o.i}" ${a === o.i ? 'checked' : ''}${D}><b>${hwLetter(o.i)}</b><span>${esc(o.t)}</span></label>`).join('')}</div>`;
    case 'fix':
      return `<div class="hwq">${head}<span class="zh">${esc(q.wrong)}</span><textarea data-k="txt" data-id="${esc(q.id)}" placeholder="${esc(T('hwWrite'))}"${D}>${esc(a || '')}</textarea></div>`;
    case 'translate':
      return `<div class="hwq">${head}<span>${esc(q.es)}</span>${q.vocab ? `<div class="es">${esc(q.vocab)}</div>` : ''}${hwTa(q, a, D)}</div>`;
    case 'zh2es':
      return `<div class="hwq">${head}<span class="zh">${esc(q.zh)}</span>${q.vocab ? `<div class="es">${esc(q.vocab)}</div>` : ''}${hwTa(q, a, D)}</div>`;
    case 'sentence':
      return `<div class="hwq">${head}<span class="zh">${esc(q.cue)}</span>${es}${hwTa(q, a, D)}</div>`;
    case 'match':
      return `<div class="matchrow"><span class="no">${no}</span><span class="zh" style="font-size:18px;flex:1">${esc(q.zh)}</span><select data-k="mt" data-id="${esc(q.id)}"${D}><option value="">${esc(T('hwPick'))}</option>${sec.rights.map((r, k) => `<option value="${k}" ${a === k ? 'selected' : ''}>${hwLetter(k)}</option>`).join('')}</select></div>`;
  }
  return '';
}
function hwOrderInner(q, dis){
  const used = hwOrder[q.id] || [], D = dis ? ' disabled' : '';
  return `<div class="ans">${used.map((ti, pos) => `<button class="tok" data-k="orm" data-id="${esc(q.id)}" data-pos="${pos}"${D}>${esc(q.tokens[ti])}</button>`).join('')}</div>
    <div>${q.tokens.map((t, ti) => used.indexOf(ti) < 0 ? `<button class="tok" data-k="ora" data-id="${esc(q.id)}" data-ti="${ti}"${D}>${esc(t)}</button>` : '').join('')}
    ${used.length && !dis ? `<button class="btn quiet" style="padding:3px 12px;font-size:13px" data-k="orc" data-id="${esc(q.id)}">${esc(T('hwClear'))}</button>` : ''}</div>`;
}

function loadJs(src){
  return new Promise((res, rej) => {
    if(window.__loaded && window.__loaded[src]) return res();
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => { (window.__loaded = window.__loaded || {})[src] = 1; res(); }; sc.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(sc);
  });
}
function hwWordHtml(d, locked){
  if(PREVIEW) return '';
  if(locked){
    return hwFile ? `<div class="card"><h2>${esc(T('hwWordTitle'))}</h2><div>${esc(T('hwWordUploaded', { name: hwFile.name }))}</div></div>` : '';
  }
  return `<div class="card" id="hwWordBox">${hwWordInner()}</div>`;
}
function hwWordInner(){
  return `<h2>${esc(T('hwWordTitle'))}</h2><div class="muted" style="font-size:13px">${esc(T('hwWordHelp'))}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
      <button class="btn quiet" id="hwWDown">${esc(T('hwWordDown'))}</button>
      <label class="btn" style="cursor:pointer;display:inline-block">${esc(T(hwFileBusy ? 'hwWordBusy' : 'hwWordUp'))}<input type="file" id="hwWUp" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none"></label></div>
    ${hwFile ? `<div style="margin-top:10px;font-size:14px">✓ ${esc(T('hwWordUploaded', { name: hwFile.name }))} <button class="btn quiet" id="hwWDel" style="padding:2px 12px;font-size:12px">${esc(T('hwWordRemove'))}</button></div>` : ''}
    <div class="savemsg err" id="hwWMsg" style="min-height:0">${esc(hwFileMsg)}</div>`;
}
function hwWordDraw(){
  const box = $('hwWordBox'); if(!box) return;
  box.innerHTML = hwWordInner(); hwWordBind();
}
function hwWordBind(){
  const d = hwDocs[hwOpen]; if(!d) return;
  const dn = $('hwWDown'); if(!dn) return;
  dn.onclick = async () => {
    hwFileMsg = ''; try{
      await loadJs('vendor/jszip.min.js');
      const tn = {}; ['fill','cloze','order','choice','fix','translate','zh2es','match','sentence'].forEach(k => tn[k] = T('hwT_' + k));
      const blob = await hwBuildDocx(d, { name: T('hwWordName'), date: T('hwWordDate'), typeName: tn, matchNote: T('hwMatchNote') });
      hwDownloadBlob(blob, (d.title || 'tarea').replace(/[\\/:*?"<>|]/g, '_') + '.docx');
    }catch(err){ console.error(err); hwFileMsg = T('hwWordDownFail'); hwWordDraw(); }
  };
  $('hwWUp').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    hwFileMsg = '';
    if(!/\.docx$/i.test(f.name)){ hwFileMsg = T('hwWordType'); return hwWordDraw(); }
    if(f.size > HW_FILE_MAX){ hwFileMsg = T('hwWordBig'); return hwWordDraw(); }
    hwFileBusy = true; hwWordDraw();
    try{
      const b64 = await hwBlobToB64(f), meta = { name: f.name, size: f.size, at: Date.now() };
      await setDoc(doc(db, 'portal', tid, 'students', studentId, 'hwFiles', hwOpen), Object.assign({ b64 }, meta));
      hwFile = meta;
    }catch(err){ console.error(err); hwFileMsg = T('hwWordFail'); }
    hwFileBusy = false; hwWordDraw();
  };
  const del = $('hwWDel'); if(del) del.onclick = async () => {
    try{ await deleteDoc(doc(db, 'portal', tid, 'students', studentId, 'hwFiles', hwOpen)); hwFile = null; hwFileMsg = ''; }catch(err){ console.error(err); hwFileMsg = T('hwWordFail'); }
    hwWordDraw();
  };
}

function renderHw(root){
  const d = hwDocs[hwOpen];
  const locked = d.status !== 'todo' || PREVIEW;
  const NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  let h = `<div class="card"><button class="btn quiet" id="hwBack" style="padding:4px 14px;font-size:13px">‹ ${esc(T('hwBack'))}</button>
    <h2 style="margin-top:12px">${esc(d.title || '')}</h2>
    <div>${hwChip(d)} <span class="muted">${esc(T('hwPoints', { n: d.total || 0 }))}</span></div>
    ${d.status === 'graded' && d.result && !hwHideScore(d) ? `<div class="big" style="margin-top:6px">${esc(T('hwScore', { got: d.result.got, max: d.result.max }))}</div>` : ''}
    ${PREVIEW ? `<div class="msg">${esc(T('hwPreviewRO'))}</div>` : d.status === 'submitted' ? `<div class="msg">${esc(T('hwLocked'))}</div>` : ''}${d.status === 'graded' && d.review && d.review.note ? `<div class="tnote"><b>${esc(T('hwTeacherNote'))}</b><br>${esc(d.review.note)}</div>` : ''}</div>`;
  const wm = d.status === 'graded' && d.review && d.review.word;
  h += hwWordHtml(d, locked);
  if(wm){
    h += `<div class="card"><h2>${esc(T('hwWordMarkedTitle'))}</h2><div class="mk">${hwCleanMark(wm.mark || '')}</div></div>`;
    if(Array.isArray(wm.keys) && wm.keys.length) h += `<div class="card"><h2>${esc(T('hwAnswersTitle'))}</h2>${wm.keys.map(k => `<div style="padding:2px 0;font-size:15px">${esc(k)}</div>`).join('')}</div>`;
  }
  (wm ? [] : (d.sections || [])).forEach((sec, si) => {
    h += `<div class="card"><h2>${NUM[si] || si + 1}、${esc(T('hwT_' + sec.type))}</h2>`;
    if(sec.bank && sec.bank.length && (sec.type === 'fill' || sec.type === 'cloze')) h += `<div class="bank">${sec.bank.map(esc).join('　')}</div>`;
    if(sec.type === 'match') h += `<div class="rights">${sec.rights.map((r, k) => `<div><b>${hwLetter(k)}</b> ${esc(r)}</div>`).join('')}</div>`;
    sec.items.forEach((q, qi) => { h += hwItemHtml(sec, q, qi + 1, locked) + hwReviewHtml(sec, q); });
    h += '</div>';
  });
  if(!locked) h += `<div class="card" id="hwFoot"><div class="savemsg" id="hwSave"></div><div id="hwAction"></div></div>`;
  root.innerHTML = h;
  $('hwBack').onclick = () => { clearTimeout(hwTimer); if(hwSaveState === 'saving') hwSave(); hwOpen = null; render(); window.scrollTo(0, 0); };
  if(locked) return;
  hwWordBind();
  hwShowSave(); hwActionDraw(d);
  root.oninput = e => {
    const t = e.target, k = t.dataset.k, id = t.dataset.id; if(!k) return;
    if(k === 'txt') hwSetDraft(id, t.value);
    else if(k === 'cz'){ const arr = Array.isArray(hwDraft[id]) ? hwDraft[id].slice() : []; arr[+t.dataset.n] = t.value; for(let i = 0; i < arr.length; i++) if(arr[i] == null) arr[i] = ''; hwSetDraft(id, arr); }
  };
  root.onchange = e => {
    const t = e.target, k = t.dataset.k, id = t.dataset.id;
    if(k === 'ch') hwSetDraft(id, +t.value);
    else if(k === 'mt') hwSetDraft(id, t.value === '' ? '' : +t.value);
  };
  root.onclick = e => {
    const t = e.target.closest('[data-k]'); if(!t) return;
    const k = t.dataset.k, id = t.dataset.id;
    if(k !== 'ora' && k !== 'orm' && k !== 'orc') return;
    const q = d.sections.flatMap(sc => sc.items).find(x => x.id === id), used = (hwOrder[id] = hwOrder[id] || []);
    if(k === 'ora') used.push(+t.dataset.ti); else if(k === 'orm') used.splice(+t.dataset.pos, 1); else used.length = 0;
    const box = root.querySelector(`[data-order="${CSS.escape(id)}"]`);
    const noEl = box.querySelector('.no');   // 只重畫這一題
    box.innerHTML = (noEl ? noEl.outerHTML : '') + hwOrderInner(q, false) + (q.es ? `<div class="es">${esc(q.es)}</div>` : '');
    hwSetDraft(id, used.map(i => q.tokens[i]));
  };
}
function hwActionDraw(d){
  const box = $('hwAction'); if(!box) return;
  if(!hwConfirming){
    box.innerHTML = `<button class="btn" id="hwSubmit" style="width:100%">${esc(T('hwSubmit'))}</button>`;
    $('hwSubmit').onclick = () => { hwConfirming = true; hwActionDraw(d); };
  }else{
    const n = hwFile ? 0 : hwUnansweredCount(d);
    box.innerHTML = `<div class="msg" style="margin:0 0 10px">${esc(T('hwConfirm'))}${n ? ' ' + esc(T('hwUnanswered', { n })) : ''}</div>
      <div style="display:flex;gap:10px"><button class="btn quiet" id="hwNo" style="flex:1">${esc(T('hwNo'))}</button><button class="btn" id="hwYes" style="flex:1">${esc(T('hwYes'))}</button></div>`;
    $('hwNo').onclick = () => { hwConfirming = false; hwActionDraw(d); };
    $('hwYes').onclick = async () => {
      clearTimeout(hwTimer); $('hwYes').disabled = true;
      const ok = await hwSave({ status: 'submitted', submittedAt: Date.now() });
      if(!ok){ hwConfirming = false; hwActionDraw(d); }
    };
  }
}

/* ───────── 資料：先用 Email 找到自己是哪位學生，再即時讀自己那一份 ───────── */
let rosterState = 'loading', authReady = false;

async function startRoster(){
  const user = auth.currentUser;
  if(!user || !tid || !user.emailVerified){ render(); return; }
  rosterState = 'loading'; docError = null; docLoaded = false; render();
  try{
    const q = query(collection(db, 'portal', tid, 'roster'), where('email', '==', String(user.email).toLowerCase()));
    const snap = await getDocs(q);
    if(snap.empty){ rosterState = 'none'; render(); return; }
    studentId = snap.docs[0].id; rosterData = snap.docs[0].data() || {}; rosterReady = true;
    rosterState = 'ok';
    tzSetting = LS.get('dc.tz.' + tid) || null;
    if(unsubDoc) unsubDoc();
    startHw(studentId);
    unsubDoc = onSnapshot(doc(db, 'portal', tid, 'students', studentId),
      s => { studentDoc = s.exists() ? s.data() : null; docLoaded = true; docError = null; if(hwOpen) return; render(); },
      err => { console.error(err); docLoaded = true; docError = (err && err.code === 'permission-denied') ? T('errNoPerm') : T('errOther'); render(); });
    render();
  }catch(err){
    console.error(err);
    rosterState = 'error'; docError = (err && err.code === 'permission-denied') ? T('errNoPerm') : T('errNet'); render();
  }
}

function startPreview(user){
  tid = user.uid; studentId = PREVIEW; docError = null; docLoaded = false; tzSetting = null;
  startHw(PREVIEW);
  getDoc(doc(db, 'portal', tid, 'roster', PREVIEW)).then(s => { rosterData = s.exists() ? s.data() : null; }).catch(() => { rosterData = null; }).then(() => { rosterReady = true; render(); });
  unsubDoc = onSnapshot(doc(db, 'portal', tid, 'students', PREVIEW),
    s => { studentDoc = s.exists() ? s.data() : null; docLoaded = true; docError = null; if(hwOpen) return; render(); },
    err => { console.error(err); docLoaded = true; docError = (err && err.code === 'permission-denied') ? T('errNoPerm') : T('errOther'); render(); });
  render();
}

onAuthStateChanged(auth, user => {
  authReady = true;
  if(unsubDoc){ unsubDoc(); unsubDoc = null; }
  stopHw(); nudStop(); reqTried = false; reqOk = false; learnOpen = false; matDoc = null; matLoaded = false; matTried = false;
  studentDoc = null; docLoaded = false; studentId = null; rosterState = 'loading'; busyErr = busyMsg = '';
  if(PREVIEW){ if(user) startPreview(user); else render(); return; }
  if(user && user.emailVerified) startRoster(); else render();
});

setLang(lang);
